name: One-time canonical roadmap reconciliation

on:
  push:
    branches:
      - migration/system-edition-canonical-20260917
    paths:
      - '.github/workflows/one-time-roadmap-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/system-edition-canonical-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only verified System Edition roadmap deliverables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SWIR-OS-ARCHITECTURE.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'ROADMAP-56.7%25-2ea043': 'ROADMAP-70.0%25-2ea043',
            'DONE-34%2F60-1f6feb': 'DONE-42%2F60-1f6feb',
            '███████████░░░░░░░░░ 56.7%': '██████████████░░░░░░ 70.0%',
            '| **34** | **26** | **60** | **56.7%** |': '| **42** | **18** | **60** | **70.0%** |',
            '- [ ] maintained Linux base/kernel and bootable image': '- [x] maintained Linux base/kernel and bootable image',
            '- [ ] SWIR boot splash and login/session manager': '- [x] SWIR boot splash and login/session manager',
            '- [ ] NetworkManager integration': '- [x] NetworkManager integration',
            '- [ ] native Linux application execution': '- [x] native Linux application execution',
            '- [ ] managed Wine/Proton compatibility service for Windows user applications': '- [x] managed Wine/Proton compatibility service for Windows user applications',
            '- [ ] Hardware Service with PCI/USB inventory': '- [x] Hardware Service with PCI/USB inventory',
            '- [ ] SWIR Driver Center / Hardware Catalog': '- [x] SWIR Driver Center / Hardware Catalog',
            '- [ ] in-tree Linux drivers + linux-firmware as primary hardware path': '- [x] in-tree Linux drivers + linux-firmware as primary hardware path',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate locked roadmap dashboard and checklist
        run: node scripts/validate-roadmap-progress.mjs
      - name: Commit verified reconciliation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-roadmap-reconcile.yml
          git add SWIR-OS-ARCHITECTURE.md
          git commit -m 'Roadmap: record verified canonical System Edition milestones'
          git push origin HEAD:migration/system-edition-canonical-20260917
