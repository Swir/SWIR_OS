name: Desktop GitHub Update Contract

on:
  push:
    paths:
      - 'desktop/windows/UpdateDownloadClient.cs'
      - 'desktop/windows/DesktopInstalledBuildIdentity.cs'
      - 'desktop/windows/DesktopUpdatePreparationHostService.cs'
      - 'desktop/windows/DesktopUpdateUserPolicy.cs'
      - 'desktop/windows/DesktopUpdateUserPolicyIntegrationSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateUserPolicyIntegration.SelfTests.csproj'
      - 'desktop/windows/DesktopUpdateBackgroundCycleSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateBackgroundCycle.SelfTests.csproj'
      - 'desktop/windows/DesktopUpdateBackgroundScheduler.cs'
      - 'desktop/windows/DesktopUpdateBackgroundSchedulerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateBackgroundScheduler.SelfTests.csproj'
      - 'desktop/windows/DesktopUpdateBackgroundHostController.cs'
      - 'desktop/windows/DesktopUpdateBackgroundHostControllerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateBackgroundHostController.SelfTests.csproj'
      - 'desktop/windows/DesktopGitHubUpdatePolicy.cs'
      - 'desktop/windows/DesktopReleaseBundleBuilder.cs'
      - 'desktop/windows/DesktopReleaseBundleSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.ReleaseBundle.SelfTests.csproj'
      - 'desktop/windows/*GitHubUpdateSource*'
      - 'desktop/windows/*GitHubUpdatePolicy*'
      - 'desktop/windows/*BuildIdentity*'
      - 'scripts/promote-desktop-update-feed.mjs'
      - 'scripts/test-desktop-update-feed.mjs'
      - 'scripts/test-desktop-update-feed-security.mjs'
      - '.github/workflows/desktop-github-update-contract.yml'
      - '.github/workflows/desktop-update-feed.yml'
  pull_request:
    paths:
      - 'desktop/windows/UpdateDownloadClient.cs'
      - 'desktop/windows/DesktopInstalledBuildIdentity.cs'
      - 'desktop/windows/DesktopUpdatePreparationHostService.cs'
      - 'desktop/windows/DesktopUpdateUserPolicy.cs'
      - 'desktop/windows/DesktopUpdateUserPolicyIntegrationSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateUserPolicyIntegration.SelfTests.csproj'
      - 'desktop/windows/DesktopUpdateBackgroundCycleSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateBackgroundCycle.SelfTests.csproj'
      - 'desktop/windows/DesktopUpdateBackgroundScheduler.cs'
      - 'desktop/windows/DesktopUpdateBackgroundSchedulerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateBackgroundScheduler.SelfTests.csproj'
      - 'desktop/windows/DesktopUpdateBackgroundHostController.cs'
      - 'desktop/windows/DesktopUpdateBackgroundHostControllerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.UpdateBackgroundHostController.SelfTests.csproj'
      - 'desktop/windows/DesktopGitHubUpdatePolicy.cs'
      - 'desktop/windows/DesktopReleaseBundleBuilder.cs'
      - 'desktop/windows/DesktopReleaseBundleSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.ReleaseBundle.SelfTests.csproj'
      - 'desktop/windows/*GitHubUpdateSource*'
      - 'desktop/windows/*GitHubUpdatePolicy*'
      - 'desktop/windows/*BuildIdentity*'
      - 'scripts/promote-desktop-update-feed.mjs'
      - 'scripts/test-desktop-update-feed.mjs'
      - 'scripts/test-desktop-update-feed-security.mjs'
      - '.github/workflows/desktop-github-update-contract.yml'
      - '.github/workflows/desktop-update-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing update security contract
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.Update.SelfTests.csproj --configuration Release
      - name: Verify GitHub Release redirect policy
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.GitHubUpdateSource.SelfTests.csproj --configuration Release
      - name: Verify installed build identity
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.BuildIdentity.SelfTests.csproj --configuration Release
      - name: Verify release policy provisioning
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.GitHubUpdatePolicy.SelfTests.csproj --configuration Release
      - name: Verify update user policy integration
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.UpdateUserPolicyIntegration.SelfTests.csproj --configuration Release
      - name: Verify policy-aware background update cycle
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.UpdateBackgroundCycle.SelfTests.csproj --configuration Release
      - name: Verify non-overlapping update background scheduler
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.UpdateBackgroundScheduler.SelfTests.csproj --configuration Release
      - name: Verify Desktop host scheduler policy controller
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.UpdateBackgroundHostController.SelfTests.csproj --configuration Release
      - name: Verify release bundle integration
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.ReleaseBundle.SelfTests.csproj --configuration Release
      - name: Verify update preparation host
        working-directory: desktop/windows
        run: dotnet run --project SWIR.Desktop.UpdatePreparationHost.SelfTests.csproj --configuration Release
      - name: Verify anti-downgrade feed promotion
        run: node scripts/test-desktop-update-feed.mjs
      - name: Verify signed feed and artifact trust boundary
        run: node scripts/test-desktop-update-feed-security.mjs
