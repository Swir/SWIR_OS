name: System Konofix Native Linux Candidate

on:
  push:
    paths:
      - 'integrations/konofix/prepare_linux_source.py'
      - 'integrations/konofix/upstream.json'
      - '.github/workflows/system-konofix-native-linux-v2.yml'
  pull_request:
    paths:
      - 'integrations/konofix/prepare_linux_source.py'
      - 'integrations/konofix/upstream.json'
      - '.github/workflows/system-konofix-native-linux-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: swir-os
      - uses: actions/checkout@v4
        with:
          repository: Swir/Konofix
          ref: 31298cc732c97ff90230c3743cd1c3be17f40b6c
          path: konofix-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install distro-managed Tauri Linux build/runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf xvfb x11-utils dbus-x11
      - name: Verify and apply minimal Linux desktop overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 swir-os/integrations/konofix/prepare_linux_source.py konofix-upstream
          test "$(git -C konofix-upstream rev-parse HEAD)" = "31298cc732c97ff90230c3743cd1c3be17f40b6c"
          mapfile -t changed < <(git -C konofix-upstream diff --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}"
          git -C konofix-upstream diff --quiet -- src src-tauri/src/lib.rs
      - name: Build exact Konofix frontend and native Linux Tauri client
        shell: bash
        working-directory: konofix-upstream
        run: |
          set -euo pipefail
          node --version
          rustc --version
          cargo --version
          npm ci
          npm run build
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin konofix-chat
          test -x src-tauri/target/release/konofix-chat
      - name: Map the real native Linux Konofix window under Xvfb
        shell: bash
        working-directory: konofix-upstream
        run: |
          set -euo pipefail
          binary="$PWD/src-tauri/target/release/konofix-chat"
          evidence="$RUNNER_TEMP/konofix-native-linux-window.txt"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1366x768x24" bash -eu -o pipefail -c '
            binary="$1"
            evidence="$2"
            "$binary" >"$RUNNER_TEMP/konofix-native-linux.stdout" 2>"$RUNNER_TEMP/konofix-native-linux.stderr" &
            pid=$!
            cleanup() {
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            found=0
            for _ in $(seq 1 80); do
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/konofix-native-linux.stderr" >&2 || true
                exit 21
              fi
              if xwininfo -root -tree >"$evidence" 2>&1 && grep -F "Konofix Chat" "$evidence" >/dev/null; then
                found=1
                break
              fi
              sleep 0.25
            done
            test "$found" -eq 1
            sleep 3
            kill -0 "$pid"
            grep -F "Konofix Chat" "$evidence"
          ' bash "$binary" "$evidence"
      - name: Keep completion claims closed
        shell: bash
        working-directory: swir-os
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { KonofixSystemCompatibilityPolicy } from './system/runtime/konofix-system-compatibility.mjs';
          if (KonofixSystemCompatibilityPolicy.nativeLinuxGuiQualified !== false ||
              KonofixSystemCompatibilityPolicy.protonQualified !== false) {
            throw new Error('Build/window evidence alone must not promote System qualification.');
          }
          NODE
