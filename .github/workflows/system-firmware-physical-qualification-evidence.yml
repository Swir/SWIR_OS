name: System Firmware Physical Qualification Evidence

on:
  push:
    branches: [main]
    paths:
      - 'system/hardware/firmware-physical-qualification-service.mjs'
      - 'system/hardware/firmware-physical-qualification-selftest.mjs'
      - 'system/hardware/firmware-physical-qualification-evidence.mjs'
      - 'system/hardware/firmware-physical-qualification-evidence-cli.mjs'
      - 'system/hardware/firmware-physical-qualification-evidence-selftest.mjs'
      - 'system/SWIR-FIRMWARE-PHYSICAL-EVIDENCE-0.1.md'
      - '.github/workflows/system-firmware-physical-qualification-evidence.yml'
  pull_request:
    paths:
      - 'system/hardware/firmware-physical-qualification-service.mjs'
      - 'system/hardware/firmware-physical-qualification-selftest.mjs'
      - 'system/hardware/firmware-physical-qualification-evidence.mjs'
      - 'system/hardware/firmware-physical-qualification-evidence-cli.mjs'
      - 'system/hardware/firmware-physical-qualification-evidence-selftest.mjs'
      - 'system/SWIR-FIRMWARE-PHYSICAL-EVIDENCE-0.1.md'
      - '.github/workflows/system-firmware-physical-qualification-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-firmware-physical-qualification-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Physical evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check system/hardware/firmware-physical-qualification-service.mjs
          node --check system/hardware/firmware-physical-qualification-selftest.mjs
          node --check system/hardware/firmware-physical-qualification-evidence.mjs
          node --check system/hardware/firmware-physical-qualification-evidence-cli.mjs
          node --check system/hardware/firmware-physical-qualification-evidence-selftest.mjs
      - name: Existing physical qualification harness self-test
        run: node system/hardware/firmware-physical-qualification-selftest.mjs
      - name: Evidence bundle self-test
        run: node system/hardware/firmware-physical-qualification-evidence-selftest.mjs
      - name: Fail-closed evidence policy assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F "qualifiedSessionRequired: true" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "ciEvidenceCountsAsPhysicalQualification: false" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "rawMachineIdPersisted: false" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "bootIdsPersistedAsHashesOnly: true" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "cryptographicOriginAuthentication: false" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "trustedComparisonRequiredForProvenance: true" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "evidenceFileOverwriteAllowed: false" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "arbitraryFirmwareFileOrUrlAllowed: false" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "automaticReboot: false" system/hardware/firmware-physical-qualification-evidence.mjs
          grep -F "automaticRollback: false" system/hardware/firmware-physical-qualification-evidence.mjs
          ! grep -F -- '--force' system/hardware/firmware-physical-qualification-evidence-cli.mjs
          ! grep -F 'fwupdmgr update' system/hardware/firmware-physical-qualification-evidence-cli.mjs

  debian-13:
    name: Debian 13 evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:13-slim
    steps:
      - name: Install runtime
        run: apt-get update && apt-get install -y --no-install-recommends nodejs ca-certificates && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Run qualification and evidence self-tests on System Edition base
        run: |
          node system/hardware/firmware-physical-qualification-selftest.mjs
          node system/hardware/firmware-physical-qualification-evidence-selftest.mjs
