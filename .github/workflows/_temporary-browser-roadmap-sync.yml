name: Temporary Browser Roadmap Sync

on:
  push:
    branches: [docs/browser-roadmap-svg-sync]
    paths:
      - '.github/workflows/_temporary-browser-roadmap-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/browser-roadmap-svg-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record verified Browser milestone and retire legacy meters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match for {old!r}, found {count}')
              return text.replace(old, new, 1)

          architecture_path = Path('SWIR-OS-ARCHITECTURE.md')
          architecture = architecture_path.read_text(encoding='utf-8')
          replacements = [
              ('ROADMAP-78.5%25-', 'ROADMAP-80.0%25-', 'architecture roadmap badge'),
              ('DONE-51%2F65-', 'DONE-52%2F65-', 'architecture done badge'),
              ('SWIR OS roadmap progress — 78.5%, 51 of 65 verified deliverables', 'SWIR OS roadmap progress — 80.0%, 52 of 65 verified deliverables', 'architecture SVG alt'),
              ('| **51** | **14** | **65** | **78.5%** |', '| **52** | **13** | **65** | **80.0%** |', 'architecture table'),
              ('percentage and the 20-segment bar.', 'percentage and deterministic SVG outputs.', 'architecture progress rule'),
              ('- [ ] native SWIR Browser with Default Apps integration and one-click approved alternative browser installation', '- [x] native SWIR Browser with Default Apps integration and one-click approved alternative browser installation', 'browser roadmap item'),
          ]
          for old, new, label in replacements:
              architecture = replace_once(architecture, old, new, label)
          legacy = '\n```text\n████████████████░░░░ 78.5%\n```\n'
          architecture = replace_once(architecture, legacy, '\n', 'architecture legacy meter')
          baseline_anchor = ('These applications must integrate with SWIR locale, accessibility, permissions, file associations, '
                             'default-app selection, update/recovery, notifications and shared visual design. They must be tested as '
                             'real daily-use applications rather than placeholder demos.')
          browser_note = ('\n\nThe first-party SWIR Browser milestone is now verified on the native GTK4/WebKitGTK 6.0 path with tabs, '
                          'bounded owner-only history/bookmarks, downloads, ephemeral private tabs, explicit permission prompts, '
                          'Default Apps integration and approved alternative-browser handoff through Software Center. This closes '
                          'the dedicated Browser roadmap item, not the broader daily-use suite.')
          architecture = replace_once(architecture, baseline_anchor, baseline_anchor + browser_note, 'browser verification note')
          architecture_path.write_text(architecture, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme_replacements = [
              ('ROADMAP-78.5%25-', 'ROADMAP-80.0%25-', 'README roadmap badge'),
              ('DONE-51%2F65-', 'DONE-52%2F65-', 'README done badge'),
              ('SWIR OS roadmap progress — 78.5%, 51 of 65 verified deliverables', 'SWIR OS roadmap progress — 80.0%, 52 of 65 verified deliverables', 'README SVG alt'),
              ('**Project progress:** 51/65 = **78.5%**.', '**Project progress:** 52/65 = **80.0%**.', 'README progress sentence'),
              ('**51 of 65 measurable roadmap deliverables are complete.**', '**52 of 65 measurable roadmap deliverables are complete.**', 'README measurable sentence'),
          ]
          for old, new, label in readme_replacements:
              readme = replace_once(readme, old, new, label)
          readme = replace_once(readme, legacy, '\n', 'README legacy meter')
          networking_row = '| 🌐 **Networking** | NetworkManager integration is exercised through a real isolated live E2E path. |'
          browser_row = ('| 🌍 **Native browser** | SWIR Browser now runs natively on GTK4/WebKitGTK 6.0 with tabs, bounded owner-only '
                         'history/bookmarks, downloads, ephemeral private tabs, explicit permission prompts, Default Apps integration '
                         'and approved alternative-browser handoff through Software Center. |')
          readme = replace_once(readme, networking_row, networking_row + '\n' + browser_row, 'README browser highlight')
          readme_path.write_text(readme, encoding='utf-8')

          validator_path = Path('scripts/validate-roadmap-progress.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          old_warn = """if (roadmapHasLegacyMeter || readmeHasLegacyMeter) {\n  console.warn('ROADMAP CONTRACT WARN: legacy text progress meter remains; SVG-only cleanup is pending.');\n}"""
          new_fail = """if (roadmapHasLegacyMeter || readmeHasLegacyMeter) {\n  fail('legacy text progress meter is forbidden by the SVG-only progress presentation standard.');\n}"""
          validator = replace_once(validator, old_warn, new_fail, 'legacy meter validator')
          validator = replace_once(
              validator,
              '  legacyMeterCleanupPending: roadmapHasLegacyMeter || readmeHasLegacyMeter,',
              '  legacyMeterClean: true,',
              'legacy meter result field',
          )
          validator_path.write_text(validator, encoding='utf-8')
          PY

          node scripts/generate-readme-progress.mjs
          node scripts/generate-readme-progress.mjs --self-test
          node scripts/generate-readme-progress.mjs --check
          node scripts/validate-roadmap-progress.mjs SWIR-OS-ARCHITECTURE.md

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          architecture = Path('SWIR-OS-ARCHITECTURE.md').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          scope = architecture.split('## Version roadmap', 1)[1].split('## Development rule', 1)[0]
          items = re.findall(r'^- \[(x| )\] .+$', scope, flags=re.M)
          assert len(items) == 65 and items.count('x') == 52 and items.count(' ') == 13
          assert '████████████████' not in architecture
          assert '████████████████' not in readme
          assert '- [x] native SWIR Browser with Default Apps integration and one-click approved alternative browser installation' in scope
          for path in ('assets/readme/progress-card.svg', 'assets/readme/progress-mini.svg', 'assets/readme/progress-template.svg'):
              ET.parse(path)
          card = Path('assets/readme/progress-card.svg').read_text(encoding='utf-8')
          mini = Path('assets/readme/progress-mini.svg').read_text(encoding='utf-8')
          assert '80.0%' in card and '52 / 65 verified deliverables' in card and 'width="880"' in card
          assert '80.0%' in mini and '52 / 65' in mini and 'width="560"' in mini
          print('browser roadmap sync verified: 52/65 = 80.0%, SVG geometry bounded, legacy meter absent')
          PY

      - name: Commit verified documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SWIR-OS-ARCHITECTURE.md scripts/validate-roadmap-progress.mjs assets/readme/progress-card.svg assets/readme/progress-mini.svg assets/readme/progress-template.svg
          git diff --cached --check
          git commit -m 'docs: record Browser milestone and enforce SVG-only progress'
          git push origin HEAD:docs/browser-roadmap-svg-sync
