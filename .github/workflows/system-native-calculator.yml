name: System Native Calculator

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/swir-calculator.py'
      - 'system/apps/core_runtime.py'
      - 'system/apps/swir-calculator.desktop'
      - 'system/session/swir-shell.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-CALCULATOR-0.1.md'
      - '.github/workflows/system-native-calculator.yml'
  pull_request:
    paths:
      - 'system/apps/swir-calculator.py'
      - 'system/apps/core_runtime.py'
      - 'system/apps/swir-calculator.desktop'
      - 'system/session/swir-shell.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-CALCULATOR-0.1.md'
      - '.github/workflows/system-native-calculator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-calculator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install static Calculator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils python3-gi gir1.2-gtk-4.0
      - name: Compile and verify Calculator safety and locale contract
        run: |
          set -euo pipefail
          python3 -m py_compile system/apps/core_runtime.py system/apps/swir-calculator.py system/session/swir-shell.py
          PYTHONPATH="$GITHUB_WORKSPACE/system/apps" python3 system/apps/swir-calculator.py --self-test
          desktop-file-validate system/apps/swir-calculator.desktop
          bash -n system/session/provision-graphical-session.sh
          grep -F 'Calculator", (("/usr/local/bin/swir-calculator",)' system/session/swir-shell.py >/dev/null
          grep -F 'system/apps/swir-calculator.py' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'system/apps/swir-calculator.desktop' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'MAX_EXPRESSION_CHARS: Final = 256' system/apps/swir-calculator.py >/dev/null
          grep -F 'MAX_AST_NODES: Final = 64' system/apps/swir-calculator.py >/dev/null
          grep -F 'safeAstEvaluator' system/apps/swir-calculator.py >/dev/null
          grep -F 'UserSettingsStore' system/apps/swir-calculator.py >/dev/null
          grep -F 'normalize_language_tag' system/apps/swir-calculator.py >/dev/null
          grep -F 'translationFallback' system/apps/swir-calculator.py >/dev/null
          grep -F 'set_tooltip_text' system/apps/swir-calculator.py >/dev/null
          ! grep -RE '(^|[^[:alnum:]_])eval\(|(^|[^[:alnum:]_])exec\(' system/apps/swir-calculator.py
          ! grep -RE 'shell *= *True|os\.system\(|subprocess\.' system/apps/swir-calculator.py
          ! grep -RE "/usr/bin/(sudo|pkexec|su)([[:space:]\"']|$)|/bin/su([[:space:]\"']|$)" system/apps/swir-calculator.py

  wayland-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4 and Wayland runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston dbus-daemon desktop-file-utils python3-gi gir1.2-gtk-4.0
          sudo install -m 0755 system/apps/swir-calculator.py /usr/local/bin/swir-calculator
          sudo install -d -m 0755 /usr/local/lib/swir
          sudo install -m 0644 system/apps/core_runtime.py /usr/local/lib/swir/core_runtime.py
          sudo install -m 0644 system/apps/swir-calculator.desktop /usr/share/applications/swir-calculator.desktop
          sudo update-desktop-database /usr/share/applications
          PYTHONPATH="$GITHUB_WORKSPACE/system/apps" python3 system/apps/swir-calculator.py --self-test
      - name: Map localized Calculator on Wayland and verify safe arithmetic path
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-calculator-runtime"
          CONFIG="${{ runner.temp }}/swir-calculator-config"
          mkdir -p "$RUNTIME" "$CONFIG/swir"
          chmod 0700 "$RUNTIME" "$CONFIG" "$CONFIG/swir"
          cat > "$CONFIG/swir/settings.json" <<'JSON'
          {
            "schema": "swir.user-settings/0.1",
            "appearance": "dark",
            "language": "pl-PL",
            "clock24h": true,
            "themeId": "builtin.swir-dark"
          }
          JSON
          chmod 0600 "$CONFIG/swir/settings.json"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export XDG_CONFIG_HOME="$CONFIG"
          export WAYLAND_DISPLAY=wayland-swir-calculator
          export GDK_BACKEND=wayland

          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          timeout --signal=TERM --kill-after=5s 25s \
            dbus-run-session -- \
            env LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
                XDG_CONFIG_HOME="$CONFIG" \
                SWIR_APP_E2E=1 \
                SWIR_APP_EVIDENCE_PATH="$RUNTIME/calculator.json" \
                SWIR_CALCULATOR_E2E_EXPRESSION='(12.5 + 7.5) * 3' \
            python3 system/apps/swir-calculator.py

          python3 - "$RUNTIME/calculator.json" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1], encoding='utf-8'))
          assert evidence['schema'] == 'swir.native-calculator-runtime-evidence/0.2'
          assert evidence['passed'] is True
          assert evidence['applicationId'] == 'dev.swir.Calculator'
          assert evidence['nativeToolkit'] == 'gtk4'
          assert evidence['displayProtocol'] == 'wayland' and evidence['windowMapped'] is True
          assert evidence['expression'] == '(12.5 + 7.5) * 3'
          assert evidence['result'] == '60'
          assert evidence['safeAstEvaluator'] is True and evidence['pythonEvalUsed'] is False
          assert evidence['networkAccess'] is False and evidence['privilegedOperations'] is False
          assert evidence['selfUpdater'] is False
          assert evidence['expressionLimitChars'] == 256 and evidence['astNodeLimit'] == 64
          assert evidence['historyBounded'] == 20
          assert evidence['requestedLanguage'] == 'pl-PL'
          assert evidence['catalogLanguage'] == 'pl-PL'
          assert evidence['translationFallback'] is False
          assert evidence['textDirection'] == 'ltr'
          assert evidence['localizedWindowTitle'] == 'Kalkulator SWIR'
          assert evidence['localizedCopyLabel'] == 'Kopiuj'
          assert evidence['localizedSurfaceVerified'] is True
          assert evidence['keyboardEntryActivation'] is True
          assert evidence['focusableKeypad'] is True
          PY

  debian13-target-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact System Edition GTK4 target runtime
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            desktop-file-utils python3 python3-gi gir1.2-gtk-4.0
          python3 -m py_compile system/apps/core_runtime.py system/apps/swir-calculator.py
          PYTHONPATH="$GITHUB_WORKSPACE/system/apps" python3 system/apps/swir-calculator.py --self-test
          desktop-file-validate system/apps/swir-calculator.desktop
          python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '4.0')
          from gi.repository import Gtk
          assert Gtk.get_major_version() == 4
          print('Debian 13 Calculator target runtime: OK')
          PY
