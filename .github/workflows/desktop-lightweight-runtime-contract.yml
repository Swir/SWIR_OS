name: Desktop Bundled Runtime Contract

on:
  push:
    branches: [main]
    paths:
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - 'desktop/windows/Program.cs'
      - 'desktop/windows/BundledWebView2Policy.cs'
      - 'desktop/windows/publish-desktop-host.ps1'
      - '.github/workflows/desktop-lightweight-runtime-contract.yml'
  pull_request:
    paths:
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - 'desktop/windows/Program.cs'
      - 'desktop/windows/BundledWebView2Policy.cs'
      - 'desktop/windows/publish-desktop-host.ps1'
      - '.github/workflows/desktop-lightweight-runtime-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create fixed-runtime packaging fixture
        shell: pwsh
        run: |
          $fixed = Join-Path '${{ runner.temp }}' 'webview2-fixed-fixture'
          New-Item -ItemType Directory -Path $fixed -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\where.exe') -Destination (Join-Path $fixed 'msedgewebview2.exe') -Force
          if (-not (Test-Path (Join-Path $fixed 'msedgewebview2.exe') -PathType Leaf)) { throw 'Could not create executable WebView2 packaging fixture.' }
          "SWIR_WEBVIEW2_FIXED_RUNTIME_DIR=$fixed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish self-contained bundled runtime
        shell: pwsh
        run: |
          $out = Join-Path '${{ runner.temp }}' 'swir-bundled-runtime'
          ./publish-desktop-host.ps1 -PublishDir $out -ReleaseVersion '0.5.7' -Channel preview -SourceCommit '${{ github.sha }}'
          $manifest = Get-Content (Join-Path $out 'desktop-host-build.json') -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'swir.desktop-host-build/0.1') { throw 'Unexpected host build schema.' }
          if ($manifest.deployment.contract -ne 'swir.desktop-bundled-runtime/0.1') { throw 'Bundled runtime contract missing.' }
          if ($manifest.deployment.mode -ne 'self-contained-bundled' -or $manifest.deployment.selfContained -ne $true -or $manifest.deployment.singleFile -ne $true) { throw 'Desktop Host must be self-contained and single-file.' }
          if ($manifest.deployment.userPrerequisiteDownloadsRequired -ne $false) { throw 'Desktop release must not require user prerequisite downloads.' }
          if ($manifest.deployment.dotnet.bundled -ne $true -or $manifest.deployment.webView2.bundled -ne $true) { throw '.NET and WebView2 must both be bundled.' }
          if ($manifest.deployment.webView2.mode -ne 'fixed-version-bundled') { throw 'WebView2 must use fixed-version bundled deployment.' }
          if ($manifest.deployment.runtimeIdentifier -ne 'win-x64' -or $manifest.deployment.targetFramework -ne 'net8.0-windows') { throw 'Desktop runtime identity mismatch.' }
          foreach ($file in @('SWIR.Desktop.Host.exe','WebView2FixedRuntime\msedgewebview2.exe')) {
            if (-not (Test-Path (Join-Path $out $file) -PathType Leaf)) { throw "Published bundled host missing $file" }
          }
          if (Test-Path (Join-Path $out 'SWIR.Desktop.Host.runtimeconfig.json') -PathType Leaf) { throw 'Single-file self-contained package unexpectedly exposes a runtimeconfig prerequisite.' }

      - name: Verify host binds bundled WebView2 path
        shell: pwsh
        run: |
          $source = Get-Content BundledWebView2Policy.cs -Raw
          foreach ($marker in @('WebView2FixedRuntime','msedgewebview2.exe','WEBVIEW2_BROWSER_EXECUTABLE_FOLDER','EnvironmentVariableTarget.Process')) {
            if (-not $source.Contains($marker)) { throw "Bundled WebView2 host binding missing: $marker" }
          }

      - name: Build shipping Desktop Host
        run: dotnet build SWIR.Desktop.Host.csproj --configuration Release
