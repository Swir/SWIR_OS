name: System Native Screenshot Tool

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/swir-screenshot.py'
      - 'system/apps/swir-screenshot.desktop'
      - 'system/tests/fake-screenshot-portal.py'
      - 'system/session/swir-shell.py'
      - 'system/session/swir-session-launcher.sh'
      - 'system/session/provision-graphical-session.sh'
      - 'system/e2e/debian13-graphical-session-vm-e2e.sh'
      - 'system/SWIR-NATIVE-SCREENSHOT-TOOL-0.1.md'
      - '.github/workflows/system-native-screenshot-tool.yml'
  pull_request:
    paths:
      - 'system/apps/swir-screenshot.py'
      - 'system/apps/swir-screenshot.desktop'
      - 'system/tests/fake-screenshot-portal.py'
      - 'system/session/swir-shell.py'
      - 'system/session/swir-session-launcher.sh'
      - 'system/session/provision-graphical-session.sh'
      - 'system/e2e/debian13-graphical-session-vm-e2e.sh'
      - 'system/SWIR-NATIVE-SCREENSHOT-TOOL-0.1.md'
      - '.github/workflows/system-native-screenshot-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-screenshot-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 screenshot contract dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils python3-gi gir1.2-gtk-4.0 gir1.2-gdkpixbuf-2.0
      - name: Compile and verify screenshot policy
        run: |
          set -euo pipefail
          python3 -m py_compile system/apps/core_runtime.py system/apps/swir-screenshot.py system/tests/fake-screenshot-portal.py system/session/swir-shell.py
          python3 system/apps/swir-screenshot.py --self-test
          bash -n system/session/swir-session-launcher.sh system/session/provision-graphical-session.sh system/e2e/debian13-graphical-session-vm-e2e.sh
          desktop-file-validate system/apps/swir-screenshot.desktop
          grep -F 'PORTAL_BUS: Final = "org.freedesktop.portal.Desktop"' system/apps/swir-screenshot.py >/dev/null
          grep -F 'PORTAL_IFACE: Final = "org.freedesktop.portal.Screenshot"' system/apps/swir-screenshot.py >/dev/null
          grep -F '"interactive": GLib.Variant("b", True)' system/apps/swir-screenshot.py >/dev/null
          grep -F 'MAX_CAPTURE_BYTES: Final = 64 * 1024 * 1024' system/apps/swir-screenshot.py >/dev/null
          grep -F 'MAX_PIXELS: Final = 40_000_000' system/apps/swir-screenshot.py >/dev/null
          grep -F 'UserSettingsStore' system/apps/swir-screenshot.py >/dev/null
          grep -F 'localizedTooltips' system/apps/swir-screenshot.py >/dev/null
          grep -F 'evidenceOwnerOnly' system/apps/swir-screenshot.py >/dev/null
          ! grep -RE 'shell *= *True|os\.system\(|/dev/(fb|dri)|\b(grim|scrot|gnome-screenshot|spectacle|import)\b' system/apps/swir-screenshot.py
          ! grep -RE "/usr/bin/(sudo|pkexec|su)([[:space:]\"']|$)|/bin/su([[:space:]\"']|$)" system/apps/swir-screenshot.py

  shipping-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical image and shell integration
        run: |
          set -euo pipefail
          grep -F '("Screenshot", (("/usr/local/bin/swir-screenshot",),))' system/session/swir-shell.py >/dev/null
          grep -F 'system/apps/swir-screenshot.py' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'system/apps/swir-screenshot.desktop' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'install -m 0755 "$SOURCE_ROOT/system/apps/swir-screenshot.py" "$(safe_target /usr/local/bin/swir-screenshot)"' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'install -m 0644 "$SOURCE_ROOT/system/apps/swir-screenshot.desktop" "$(safe_target /usr/share/applications/swir-screenshot.desktop)"' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'verify_trusted_regular_file /usr/local/bin/swir-screenshot yes' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'verify_trusted_regular_file /usr/share/applications/swir-screenshot.desktop no' system/session/provision-graphical-session.sh >/dev/null
          grep -F "assert {'Files', 'Terminal', 'Settings', 'Screenshot', 'Install SWIR OS'} <= set(shell.get('launcherEntries', []))" system/session/swir-session-launcher.sh >/dev/null
          grep -F "assert 'Screenshot' in e['shell']['launcherEntries']" system/e2e/debian13-graphical-session-vm-e2e.sh >/dev/null
          grep -F '[ -x /usr/local/bin/swir-screenshot ] || fail screenshot-tool-missing' system/e2e/debian13-graphical-session-vm-e2e.sh >/dev/null
          ! grep -F 'system/tests/fake-screenshot-portal.py' system/session/provision-graphical-session.sh

  wayland-portal-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4, D-Bus and Wayland runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston dbus-daemon libglib2.0-bin python3-gi gir1.2-gtk-4.0 gir1.2-gdkpixbuf-2.0
      - name: Map Screenshot Tool and exercise XDG portal request
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-screenshot-runtime"
          CONFIG="${{ runner.temp }}/swir-screenshot-config"
          OUT="$RUNTIME/output"
          mkdir -p "$RUNTIME" "$CONFIG/swir" "$OUT"
          chmod 0700 "$RUNTIME" "$CONFIG" "$CONFIG/swir" "$OUT"
          cat > "$CONFIG/swir/settings.json" <<'JSON'
          {
            "schema": "swir.user-settings/0.1",
            "appearance": "dark",
            "language": "pl-PL",
            "clock24h": true,
            "themeId": "builtin.swir-dark"
          }
          JSON
          chmod 0600 "$CONFIG/swir/settings.json"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export XDG_CONFIG_HOME="$CONFIG"
          export WAYLAND_DISPLAY=wayland-swir-screenshot
          export GDK_BACKEND=wayland
          export SWIR_SCREENSHOT_FAKE_SOURCE="$RUNTIME/source.png"
          export SWIR_SCREENSHOT_E2E_OUTPUT_DIR="$OUT"
          export SWIR_APP_E2E=1
          export SWIR_APP_EVIDENCE_PATH="$RUNTIME/screenshot.json"

          python3 - "$SWIR_SCREENSHOT_FAKE_SOURCE" <<'PY'
          import gi, sys
          gi.require_version('GdkPixbuf', '2.0')
          from gi.repository import GdkPixbuf
          p = GdkPixbuf.Pixbuf.new(GdkPixbuf.Colorspace.RGB, True, 8, 96, 64)
          p.fill(0x0088FFFF)
          p.savev(sys.argv[1], 'png', [], [])
          PY

          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          timeout --signal=TERM --kill-after=5s 35s dbus-run-session -- bash -eu -o pipefail -c '
            python3 system/tests/fake-screenshot-portal.py >"$XDG_RUNTIME_DIR/portal.log" 2>&1 &
            portal_pid=$!
            trap "kill $portal_pid 2>/dev/null || true; wait $portal_pid 2>/dev/null || true" EXIT
            for i in $(seq 1 80); do
              gdbus introspect --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop >/dev/null 2>&1 && break
              kill -0 "$portal_pid"
              sleep 0.1
            done
            gdbus introspect --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop | grep -F org.freedesktop.portal.Screenshot >/dev/null
            env LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none python3 system/apps/swir-screenshot.py
          '

          python3 - "$RUNTIME/screenshot.json" "$OUT" <<'PY'
          import json, pathlib, stat, sys
          evidence_path = pathlib.Path(sys.argv[1])
          evidence = json.load(open(evidence_path, encoding='utf-8'))
          out = pathlib.Path(sys.argv[2])
          assert evidence['schema'] == 'swir.native-screenshot-runtime-evidence/0.2'
          assert evidence['passed'] is True
          assert evidence['applicationId'] == 'dev.swir.Screenshot'
          assert evidence['nativeToolkit'] == 'gtk4-gdkpixbuf'
          assert evidence['displayProtocol'] == 'wayland' and evidence['windowMapped'] is True
          assert evidence['portalBus'] == 'org.freedesktop.portal.Desktop'
          assert evidence['portalInterface'] == 'org.freedesktop.portal.Screenshot'
          assert evidence['portalRequestUsed'] is True and evidence['interactiveRequest'] is True
          assert evidence['sourceValidated'] is True and evidence['sourceUriScheme'] == 'file'
          assert evidence['remoteUriAccepted'] is False and evidence['shellCapture'] is False
          assert evidence['privilegedOperations'] is False and evidence['selfUpdater'] is False
          assert evidence['requestedLanguage'] == 'pl-PL' and evidence['catalogLanguage'] == 'pl-PL'
          assert evidence['translationFallback'] is False and evidence['textDirection'] == 'ltr'
          assert evidence['localizedWindowTitle'] == 'Zrzut ekranu SWIR'
          assert evidence['localizedCaptureLabel'] == 'Zrób zrzut ekranu'
          assert evidence['localizedSurfaceVerified'] is True
          assert evidence['captureButtonFocusable'] is True and evidence['localizedTooltips'] is True
          assert evidence['evidenceOwnerOnly'] is True
          saved = out / evidence['savedFile']
          assert saved.is_file() and saved.stat().st_size > 0
          assert stat.S_IMODE(saved.stat().st_mode) == 0o600
          assert evidence['savedMode'] == '0600' and evidence['dimensions'] == [96, 64]
          assert stat.S_IMODE(evidence_path.stat().st_mode) == 0o600
          PY

  debian13-target-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact System Edition GTK4 target runtime
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends desktop-file-utils python3 python3-gi gir1.2-gtk-4.0 gir1.2-gdkpixbuf-2.0
          python3 -m py_compile system/apps/core_runtime.py system/apps/swir-screenshot.py system/tests/fake-screenshot-portal.py
          python3 system/apps/swir-screenshot.py --self-test
          desktop-file-validate system/apps/swir-screenshot.desktop
          python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('GdkPixbuf', '2.0')
          from gi.repository import Gtk
          assert Gtk.get_major_version() == 4
          print('Debian 13 Screenshot Tool target runtime: OK')
          PY
