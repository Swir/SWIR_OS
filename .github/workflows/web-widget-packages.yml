name: Web Widget Packages

on:
  pull_request:
    paths:
      - 'swir-widgets.js'
      - 'swir-widget-*.html'
      - 'swir-packages.js'
      - 'swir-v17.js'
      - 'swir-install-pipeline.js'
      - 'SWIR-APP-PACKAGE-1.0.md'
      - 'scripts/verify-web-widget-packages.mjs'
      - '.github/workflows/web-widget-packages.yml'
  push:
    branches: [main]
    paths:
      - 'swir-widgets.js'
      - 'swir-widget-*.html'
      - 'swir-packages.js'
      - 'swir-v17.js'
      - 'swir-install-pipeline.js'
      - 'SWIR-APP-PACKAGE-1.0.md'
      - 'scripts/verify-web-widget-packages.mjs'
      - '.github/workflows/web-widget-packages.yml'

permissions:
  contents: read

jobs:
  widget-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check swir-widgets.js
          node --check swir-v17.js
          node --check swir-packages.js
      - name: Verify package, trust and renderer boundaries
        run: node scripts/verify-web-widget-packages.mjs
