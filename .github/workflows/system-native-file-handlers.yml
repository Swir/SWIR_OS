name: System Native File Handlers

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/swir-text-editor.py'
      - 'system/apps/swir-text-editor.desktop'
      - 'system/apps/swir-files.py'
      - 'system/apps/swir-archive-manager.desktop'
      - 'system/SWIR-NATIVE-FILE-HANDLERS-0.1.md'
      - '.github/workflows/system-native-file-handlers.yml'
  pull_request:
    paths:
      - 'system/apps/swir-text-editor.py'
      - 'system/apps/swir-text-editor.desktop'
      - 'system/apps/swir-files.py'
      - 'system/apps/swir-archive-manager.desktop'
      - 'system/SWIR-NATIVE-FILE-HANDLERS-0.1.md'
      - '.github/workflows/system-native-file-handlers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-file-handlers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify handler metadata and fail-closed local-file policy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 desktop-file-utils
          python3 -m py_compile system/apps/swir-text-editor.py system/apps/swir-files.py
          python3 system/apps/swir-text-editor.py --self-test
          python3 system/apps/swir-files.py --archive-self-test
          desktop-file-validate system/apps/swir-text-editor.desktop
          desktop-file-validate system/apps/swir-archive-manager.desktop
          grep -F 'Exec=/usr/local/bin/swir-text-editor %f' system/apps/swir-text-editor.desktop >/dev/null
          grep -F 'Exec=/usr/local/bin/swir-files --archive-manager --archive-open %f' system/apps/swir-archive-manager.desktop >/dev/null
          grep -F 'Gio.ApplicationFlags.HANDLES_OPEN' system/apps/swir-text-editor.py >/dev/null
          grep -F 'document changed since it was opened; refusing overwrite' system/apps/swir-text-editor.py >/dev/null
          grep -F 'remote/URI document input is not accepted' system/apps/swir-text-editor.py >/dev/null
          grep -F 'O_NOFOLLOW' system/apps/swir-files.py >/dev/null
          ! grep -RE 'shell *= *True|os\.system\(' system/apps/swir-text-editor.py system/apps/swir-files.py
          ! grep -RE "/usr/bin/(sudo|pkexec|su)([[:space:]\"']|$)|/bin/su([[:space:]\"']|$)" system/apps/swir-text-editor.py system/apps/swir-files.py

  wayland-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4 and Wayland runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston dbus-daemon python3-gi gir1.2-gtk-4.0
      - name: Exercise text/code and archive local-file handlers
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-file-handlers"
          DEST="$RUNTIME/archive-destination"
          mkdir -p "$RUNTIME" "$DEST"
          chmod 0700 "$RUNTIME" "$DEST"
          printf 'print("SWIR handler E2E")\n' > "$RUNTIME/sample.py"
          python3 - "$RUNTIME/sample.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('docs/readme.txt', b'SWIR handler archive E2E\n')
          PY

          export XDG_RUNTIME_DIR="$RUNTIME"
          export WAYLAND_DISPLAY=wayland-swir-file-handlers
          export GDK_BACKEND=wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          timeout --signal=TERM --kill-after=5s 30s \
            dbus-run-session -- \
            env LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
                SWIR_APP_E2E=1 \
                SWIR_APP_EVIDENCE_PATH="$RUNTIME/text-editor.json" \
                SWIR_TEXT_E2E_INPUT="$RUNTIME/sample.py" \
            python3 system/apps/swir-text-editor.py "$RUNTIME/sample.py"

          timeout --signal=TERM --kill-after=5s 30s \
            dbus-run-session -- \
            env LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
                SWIR_APP_E2E=1 \
                SWIR_APP_EVIDENCE_PATH="$RUNTIME/archive.json" \
                SWIR_ARCHIVE_E2E_INPUT="$RUNTIME/sample.zip" \
                SWIR_ARCHIVE_E2E_DESTINATION="$DEST" \
            python3 system/apps/swir-files.py --archive-manager --archive-open "$RUNTIME/sample.zip"

          python3 - "$RUNTIME/text-editor.json" "$RUNTIME/archive.json" "$RUNTIME/sample.py" "$DEST" <<'PY'
          import json, pathlib, stat, sys
          text = json.load(open(sys.argv[1], encoding='utf-8'))
          archive = json.load(open(sys.argv[2], encoding='utf-8'))
          text_path = pathlib.Path(sys.argv[3])
          destination = pathlib.Path(sys.argv[4]).resolve()

          assert text['schema'] == 'swir.native-text-editor-runtime-evidence/0.1'
          assert text['passed'] is True
          assert text['applicationId'] == 'dev.swir.TextEditor'
          assert text['nativeToolkit'] == 'gtk4' and text['displayProtocol'] == 'wayland'
          assert text['windowMapped'] is True and text['privilegedOperations'] is False
          assert text['localFilesOnly'] is True and text['remoteUriInputAccepted'] is False
          assert text['symlinkInputAccepted'] is False and text['atomicSave'] is True
          assert text_path.read_text(encoding='utf-8').endswith('# SWIR Text Editor E2E saved\n')

          assert archive['schema'] == 'swir.native-archive-manager-runtime-evidence/0.1'
          assert archive['passed'] is True
          assert archive['applicationId'] == 'dev.swir.ArchiveManager'
          assert archive['windowMapped'] is True and archive['privilegedOperations'] is False
          root = pathlib.Path(archive['extractionRoot'])
          assert root.parent == destination
          assert stat.S_IMODE(root.stat().st_mode) == 0o700
          assert (root / 'docs' / 'readme.txt').read_bytes() == b'SWIR handler archive E2E\n'
          PY
