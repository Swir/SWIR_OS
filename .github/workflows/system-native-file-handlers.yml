name: System Native File Handlers

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/swir-text-editor.py'
      - 'system/apps/swir-text-editor.desktop'
      - 'system/apps/swir-files.py'
      - 'system/apps/swir-archive-manager.desktop'
      - '.github/workflows/system-native-file-handlers.yml'
  pull_request:
    paths:
      - 'system/apps/swir-text-editor.py'
      - 'system/apps/swir-text-editor.desktop'
      - 'system/apps/swir-files.py'
      - 'system/apps/swir-archive-manager.desktop'
      - '.github/workflows/system-native-file-handlers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-file-handlers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate handlers and archive safety policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile system/apps/swir-text-editor.py system/apps/swir-files.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils python3-gi gir1.2-gtk-4.0
          desktop-file-validate system/apps/swir-text-editor.desktop
          desktop-file-validate system/apps/swir-archive-manager.desktop
          grep -F 'MimeType=text/plain;application/json;text/x-python;' system/apps/swir-text-editor.desktop >/dev/null
          grep -F 'Exec=/usr/local/bin/swir-files --archive-manager --archive-open %f' system/apps/swir-archive-manager.desktop >/dev/null
          python3 system/apps/swir-files.py --archive-self-test
          ! grep -RE '/usr/bin/(sudo|pkexec|su)|/bin/su|subprocess\.|os\.system\(' system/apps/swir-text-editor.py

  wayland-text-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4 and Wayland runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston dbus-daemon python3-gi gir1.2-gtk-4.0
      - name: Exercise safe local file open and atomic save
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-runtime"
          WORK="${{ runner.temp }}/swir-text"
          mkdir -p "$RUNTIME" "$WORK"
          chmod 0700 "$RUNTIME" "$WORK"
          INPUT="$WORK/sample.py"
          printf 'print("SWIR")\n' > "$INPUT"
          chmod 0640 "$INPUT"

          export XDG_RUNTIME_DIR="$RUNTIME"
          export WAYLAND_DISPLAY=wayland-swir-text
          export GDK_BACKEND=wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          timeout --signal=TERM --kill-after=5s 30s \
            dbus-run-session -- \
            env LIBGL_ALWAYS_SOFTWARE=1 \
                SWIR_TEXT_EDITOR_E2E=1 \
                SWIR_APP_EVIDENCE_PATH="$RUNTIME/text-editor.json" \
                python3 system/apps/swir-text-editor.py "$INPUT"

          python3 - "$RUNTIME/text-editor.json" "$INPUT" <<'PY'
          import json, pathlib, stat, sys
          evidence = json.load(open(sys.argv[1], encoding='utf-8'))
          target = pathlib.Path(sys.argv[2])
          assert evidence['schema'] == 'swir.native-text-editor-runtime-evidence/0.1'
          assert evidence['passed'] is True
          assert evidence['applicationId'] == 'dev.swir.TextEditor'
          assert evidence['displayProtocol'] == 'wayland'
          assert evidence['windowMapped'] is True
          assert evidence['localFileOnly'] is True
          assert evidence['utf8Only'] is True
          assert evidence['atomicSave'] is True
          assert evidence['conflictDetection'] is True
          assert evidence['symlinkPathsAccepted'] is False
          assert evidence['privilegedOperations'] is False
          assert target.read_text(encoding='utf-8').endswith('SWIR Text Editor E2E\n')
          assert stat.S_IMODE(target.stat().st_mode) == 0o640
          assert stat.S_IMODE(pathlib.Path(sys.argv[1]).stat().st_mode) == 0o600
          PY
