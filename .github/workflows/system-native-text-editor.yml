name: System Native Text Editor

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/swir-text-editor.py'
      - 'system/apps/core_runtime.py'
      - 'system/apps/swir-text-editor.desktop'
      - 'system/apps/native-daily-suite.json'
      - 'system/apps/verify-native-daily-suite.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-DAILY-SUITE-0.1.md'
      - '.github/workflows/system-native-text-editor.yml'
  pull_request:
    paths:
      - 'system/apps/swir-text-editor.py'
      - 'system/apps/core_runtime.py'
      - 'system/apps/swir-text-editor.desktop'
      - 'system/apps/native-daily-suite.json'
      - 'system/apps/verify-native-daily-suite.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-DAILY-SUITE-0.1.md'
      - '.github/workflows/system-native-text-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-text-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install static Text Editor dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils python3-gi gir1.2-gtk-4.0
      - name: Compile and verify local-file safety and locale contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile system/apps/swir-text-editor.py
          python3 system/apps/swir-text-editor.py --self-test
          desktop-file-validate system/apps/swir-text-editor.desktop
          grep -F 'system/apps/swir-text-editor.py' system/session/provision-graphical-session.sh >/dev/null
          grep -F '/usr/local/bin/swir-text-editor' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'system/apps/swir-text-editor.desktop' system/session/provision-graphical-session.sh >/dev/null
          grep -F '"text": "swir-text-editor.desktop"' system/apps/swir-settings.py >/dev/null
          grep -F 'UserSettingsStore' system/apps/swir-text-editor.py >/dev/null
          grep -F 'normalize_language_tag' system/apps/swir-text-editor.py >/dev/null
          grep -F '"pl-PL"' system/apps/swir-text-editor.py >/dev/null
          grep -F '"nb-NO"' system/apps/swir-text-editor.py >/dev/null
          grep -F 'set_tooltip_text' system/apps/swir-text-editor.py >/dev/null
          grep -F 'set_direction' system/apps/swir-text-editor.py >/dev/null
          grep -F 'O_NOFOLLOW' system/apps/swir-text-editor.py >/dev/null
          grep -F 'os.O_EXCL' system/apps/swir-text-editor.py >/dev/null
          grep -F 'os.replace(temp, path)' system/apps/swir-text-editor.py >/dev/null
          grep -F 'document changed since it was opened; refusing overwrite' system/apps/swir-text-editor.py >/dev/null
          grep -F 'Save As refuses to replace an existing file' system/apps/swir-text-editor.py >/dev/null
          ! grep -RE 'shell *= *True|os\.system\(|subprocess\.' system/apps/swir-text-editor.py
          ! grep -RE "/usr/bin/(sudo|pkexec|su)([[:space:]\"']|$)|/bin/su([[:space:]\"']|$)" system/apps/swir-text-editor.py

  wayland-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4 and Wayland runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston dbus-daemon desktop-file-utils python3-gi gir1.2-gtk-4.0
          python3 system/apps/swir-text-editor.py --self-test
          desktop-file-validate system/apps/swir-text-editor.desktop
      - name: Map localized Text Editor and verify atomic edit/create behavior
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-text-editor-runtime"
          CONFIG="${{ runner.temp }}/swir-text-editor-config"
          mkdir -p "$RUNTIME" "$CONFIG/swir"
          chmod 0700 "$RUNTIME" "$CONFIG" "$CONFIG/swir"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export XDG_CONFIG_HOME="$CONFIG"
          export WAYLAND_DISPLAY=wayland-swir-text-editor
          export GDK_BACKEND=wayland

          cat > "$CONFIG/swir/settings.json" <<'JSON'
          {"schema":"swir.user-settings/0.1","appearance":"dark","language":"pl-PL","clock24h":true,"themeId":"builtin.swir-dark"}
          JSON
          chmod 0600 "$CONFIG/swir/settings.json"

          printf '%s\n' 'print("SWIR Text Editor")' > "$RUNTIME/input.py"
          chmod 0600 "$RUNTIME/input.py"

          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          timeout --signal=TERM --kill-after=5s 25s dbus-run-session -- \
            env LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
                XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
                SWIR_APP_E2E=1 \
                SWIR_APP_EVIDENCE_PATH="$RUNTIME/evidence.json" \
                SWIR_TEXT_E2E_INPUT="$RUNTIME/input.py" \
            python3 system/apps/swir-text-editor.py

          python3 - "$RUNTIME/evidence.json" "$RUNTIME/input.py" "$RUNTIME/swir-text-editor-created.txt" <<'PY'
          import json, pathlib, stat, sys
          evidence = json.load(open(sys.argv[1], encoding='utf-8'))
          edited = pathlib.Path(sys.argv[2])
          created = pathlib.Path(sys.argv[3])
          assert evidence['schema'] == 'swir.native-text-editor-runtime-evidence/0.2'
          assert evidence['passed'] is True
          assert evidence['applicationId'] == 'dev.swir.TextEditor'
          assert evidence['nativeToolkit'] == 'gtk4'
          assert evidence['displayProtocol'] == 'wayland' and evidence['windowMapped'] is True
          assert evidence['privilegedOperations'] is False and evidence['localFilesOnly'] is True
          assert evidence['remoteUriInputAccepted'] is False
          assert evidence['symlinkInputAccepted'] is False and evidence['hardlinkInputAccepted'] is False
          assert evidence['atomicOverwrite'] is True and evidence['exclusiveCreate'] is True
          assert evidence['existingSaveAsTargetReplaced'] is False
          assert evidence['interactiveOpen'] is True and evidence['interactiveNew'] is True and evidence['interactiveSaveAs'] is True
          assert evidence['maxDocumentBytes'] == 4 * 1024 * 1024
          assert evidence['requestedLanguage'] == 'pl-PL'
          assert evidence['catalogLanguage'] == 'pl-PL' and evidence['fallbackUsed'] is False
          assert evidence['textDirection'] == 'ltr'
          assert evidence['windowTitle'] == 'Edytor tekstu SWIR'
          assert evidence['buttonLabels'] == {'new': 'Nowy', 'open': 'Otwórz', 'save': 'Zapisz', 'save_as': 'Zapisz jako'}
          assert evidence['editorTooltip'] == 'Lokalny edytor tekstu UTF-8'
          assert edited.read_text(encoding='utf-8').endswith('# SWIR Text Editor E2E saved\n')
          assert stat.S_IMODE(edited.stat().st_mode) == 0o600
          assert created.read_text(encoding='utf-8') == 'created by E2E\n'
          assert stat.S_IMODE(created.stat().st_mode) == 0o600
          PY

  debian13-target-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact System Edition GTK4 target runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends desktop-file-utils python3 python3-gi gir1.2-gtk-4.0
          python3 -m py_compile system/apps/swir-text-editor.py
          python3 system/apps/swir-text-editor.py --self-test
          desktop-file-validate system/apps/swir-text-editor.desktop
          python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '4.0')
          from gi.repository import Gtk
          assert Gtk.get_major_version() == 4
          print('Debian 13 Text Editor target runtime: OK')
          PY
