name: Repair final native suite integration gate

on:
  push:
    branches: [system/native-suite-final-locale]
    paths:
      - '.github/workflows/repair-photo-runtime-locale.yml'

permissions:
  contents: write

concurrency:
  group: repair-final-native-suite
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/native-suite-final-locale
          fetch-depth: 0
      - name: Repair final native-suite gate
        run: python3 scripts/repair-photo-runtime-locale.py
      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile system/apps/verify-native-daily-suite.py
          grep -F 'swir.native-photo-studio-runtime-evidence/0.4' system/apps/verify-native-daily-suite.py >/dev/null
          grep -F 'Photo Studio now closes the last identified locale/accessibility surface' system/SWIR-NATIVE-DAILY-SUITE-0.1.md >/dev/null
          git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/repair-photo-runtime-locale.yml scripts/repair-photo-runtime-locale.py
          git config user.name 'SWIR CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add system/apps/verify-native-daily-suite.py system/SWIR-NATIVE-DAILY-SUITE-0.1.md
          git diff --cached --check
          git commit -m 'CI: align native suite with Photo Studio runtime evidence'
          git push origin HEAD:system/native-suite-final-locale
