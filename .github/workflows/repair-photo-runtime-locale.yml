name: Repair Photo Studio runtime locale

on:
  push:
    branches: [system/native-suite-final-locale]
    paths:
      - '.github/workflows/repair-photo-runtime-locale.yml'

permissions:
  contents: write

concurrency:
  group: repair-photo-runtime-locale
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/native-suite-final-locale
          fetch-depth: 0
      - name: Apply reviewed Photo Studio locale patch
        run: python3 scripts/repair-photo-runtime-locale.py
      - name: Validate patched sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile system/apps/swir-photo-studio.py system/apps/core_runtime.py
          git diff --check
          grep -F 'swir.native-photo-studio-runtime-evidence/0.4' system/apps/swir-photo-studio.py system/SWIR-NATIVE-PHOTO-STUDIO-0.1.md .github/workflows/system-native-photo-studio.yml >/dev/null
          grep -F 'catalog = requested if requested in _TRANSLATIONS else "en"' system/apps/swir-photo-studio.py >/dev/null
      - name: Commit Photo Studio runtime locale implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SWIR CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add system/apps/swir-photo-studio.py system/SWIR-NATIVE-PHOTO-STUDIO-0.1.md .github/workflows/system-native-photo-studio.yml
          git diff --cached --check
          git commit -m 'System: localize Photo Studio runtime surface'
          git push origin HEAD:system/native-suite-final-locale
