name: System Package UI Broker Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/ipc/swir-package-transaction-broker.mjs'
      - 'system/ipc/swir-package-transaction-broker.selftest.mjs'
      - 'system/ipc/swir-package-transaction.service'
      - 'system/ipc/swir-peer-authorization.socket'
      - 'system/ipc/swir-peer-authorization.service'
      - 'system/apps/package_transaction_client.py'
      - 'system/apps/package_transaction_client.selftest.py'
      - 'system/SWIR-PACKAGE-UI-BROKER-0.1.md'
      - '.github/workflows/system-package-ui-broker-contract.yml'
  pull_request:
    paths:
      - 'system/ipc/swir-package-transaction-broker.mjs'
      - 'system/ipc/swir-package-transaction-broker.selftest.mjs'
      - 'system/ipc/swir-package-transaction.service'
      - 'system/ipc/swir-peer-authorization.socket'
      - 'system/ipc/swir-peer-authorization.service'
      - 'system/apps/package_transaction_client.py'
      - 'system/apps/package_transaction_client.selftest.py'
      - 'system/SWIR-PACKAGE-UI-BROKER-0.1.md'
      - '.github/workflows/system-package-ui-broker-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-package-ui-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and broker self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check system/ipc/swir-package-transaction-broker.mjs
          node --check system/ipc/swir-package-transaction-broker.selftest.mjs
          node system/ipc/swir-package-transaction-broker.selftest.mjs
          python3 -m py_compile \
            system/apps/package_transaction_client.py \
            system/apps/package_transaction_client.selftest.py
          PYTHONPATH=system/apps python3 system/apps/package_transaction_client.selftest.py

      - name: Verify confused-deputy and direct-tool boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F "callerSuppliedUnixIdentity: false" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "peerAuthorizationEnvelopeRequiredForCommit: true" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "planRecomputedBeforeCommit: true" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F '"allowUserInteraction": True' system/apps/package_transaction_client.py >/dev/null
          ! grep -RE 'subprocess|os\.system|shell *= *True' system/apps/package_transaction_client.py
          ! grep -RE 'apt(-get)? +install|apt(-get)? +remove|pkexec +|sudo +' system/apps/package_transaction_client.py
          ! grep -RE '"uid" *:|"pid" *:' system/apps/package_transaction_client.py

      - name: Validate service hardening contract
        shell: bash
        run: |
          set -euo pipefail
          # systemd-analyze validates ExecStart paths as well as unit syntax. Stage
          # inert CI-only artifacts at the production paths so verification tests
          # the actual units instead of failing merely because the image has not
          # been provisioned on the GitHub runner.
          sudo install -d -m 0755 /usr/libexec/swir /usr/lib/swir/package-broker/ipc
          sudo install -m 0755 /bin/true /usr/libexec/swir/swir-peer-authorization-broker
          sudo install -m 0644 system/ipc/swir-package-transaction-broker.mjs \
            /usr/lib/swir/package-broker/ipc/swir-package-transaction-broker.mjs
          UNIT_PATH="$GITHUB_WORKSPACE/system/ipc:/usr/lib/systemd/system:/lib/systemd/system"
          sudo env SYSTEMD_UNIT_PATH="$UNIT_PATH" systemd-analyze verify \
            system/ipc/swir-peer-authorization.socket \
            system/ipc/swir-peer-authorization.service \
            system/ipc/swir-package-transaction.service
          grep -F 'User=root' system/ipc/swir-package-transaction.service >/dev/null
          grep -F 'Requires=swir-peer-authorization.socket' system/ipc/swir-package-transaction.service >/dev/null
          grep -F 'PrivateTmp=yes' system/ipc/swir-package-transaction.service >/dev/null
          grep -F 'ProtectHome=yes' system/ipc/swir-package-transaction.service >/dev/null
          grep -F 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK' system/ipc/swir-package-transaction.service >/dev/null

      - name: Prove existing transaction security stack remains the mutation path
        shell: bash
        run: |
          set -euo pipefail
          grep -F "SystemPackageTransactionService" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "GuardedPkexecPackageExecutor" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "createPeerAuthorizedSystemPackageSecurityBoundary" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "AptDependencyResolver" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "DistributionPackageSnapshotProvider" system/ipc/swir-package-transaction-broker.mjs >/dev/null
          grep -F "NativePackageHealthVerifier" system/ipc/swir-package-transaction-broker.mjs >/dev/null
