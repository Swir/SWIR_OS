name: System Vendor Repository Disposable VM E2E

on:
  push:
    branches: [main]
    paths:
      - 'system/e2e/vendor-repository-activation-vm-e2e.sh'
      - 'system/e2e/vendor-repository-activation-vm-guest.mjs'
      - 'system/hardware/vendor-official-repository-service.mjs'
      - 'system/hardware/vendor-repository-trust-evidence.mjs'
      - 'system/hardware/vendor-repository-transaction-binding.mjs'
      - 'system/hardware/vendor-repository-activation-transaction-service.mjs'
      - 'system/hardware/vendor-repository-driver-center-integration.mjs'
      - 'system/hardware/vendor-repositories.debian13.json'
      - 'system/hardware/hardware-catalog.json'
      - 'system/image/system-image-provisioning.json'
      - '.github/workflows/system-vendor-repository-vm-e2e.yml'
  pull_request:
    paths:
      - 'system/e2e/vendor-repository-activation-vm-e2e.sh'
      - 'system/e2e/vendor-repository-activation-vm-guest.mjs'
      - 'system/hardware/vendor-official-repository-service.mjs'
      - 'system/hardware/vendor-repository-trust-evidence.mjs'
      - 'system/hardware/vendor-repository-transaction-binding.mjs'
      - 'system/hardware/vendor-repository-activation-transaction-service.mjs'
      - 'system/hardware/vendor-repository-driver-center-integration.mjs'
      - 'system/hardware/vendor-repositories.debian13.json'
      - 'system/hardware/hardware-catalog.json'
      - 'system/image/system-image-provisioning.json'
      - '.github/workflows/system-vendor-repository-vm-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-vendor-repository-vm-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-repository-vm-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate disposable VM E2E sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n system/e2e/vendor-repository-activation-vm-e2e.sh
          node --check system/e2e/vendor-repository-activation-vm-guest.mjs
          node --check system/hardware/vendor-repository-driver-center-integration.mjs
          python3 -m json.tool system/hardware/vendor-repositories.debian13.json >/dev/null
          python3 -m json.tool system/hardware/hardware-catalog.json >/dev/null
          python3 -m json.tool system/image/system-image-provisioning.json >/dev/null
          grep -F "physicalHardwareClaim: false" system/e2e/vendor-repository-activation-vm-guest.mjs >/dev/null
          grep -F "liveUsbClaim: false" system/e2e/vendor-repository-activation-vm-guest.mjs >/dev/null
          grep -F "packageInstalled: false" system/e2e/vendor-repository-activation-vm-guest.mjs >/dev/null
          grep -F "fault-injected-rollback-interruption" system/e2e/vendor-repository-activation-vm-guest.mjs >/dev/null
          grep -F "automaticEnable\": false" system/hardware/vendor-repositories.debian13.json >/dev/null
          ! grep -RE -- '--no-check-gpg|AllowUnauthenticated|trusted=yes|Trusted:[[:space:]]*yes|shell:[[:space:]]*true' \
            system/e2e/vendor-repository-activation-vm-e2e.sh \
            system/e2e/vendor-repository-activation-vm-guest.mjs \
            system/hardware/vendor-repositories.debian13.json

      - name: Install controlled disposable VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring qemu-system-x86 e2fsprogs rsync util-linux

      - name: Boot disposable Debian 13 VM and verify vendor lifecycle
        env:
          SWIR_VENDOR_VM_WORK_ROOT: ${{ runner.temp }}/swir-vendor-repository-vm
          SWIR_VENDOR_VM_ARTIFACT_DIR: ${{ runner.temp }}/swir-vendor-repository-vm-artifacts
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=SWIR_VENDOR_VM_WORK_ROOT,SWIR_VENDOR_VM_ARTIFACT_DIR \
            bash system/e2e/vendor-repository-activation-vm-e2e.sh

      - name: Export readable diagnostics
        if: always()
        shell: bash
        run: sudo chown -R "$USER:$USER" "${{ runner.temp }}/swir-vendor-repository-vm-artifacts" 2>/dev/null || true

      - name: Revalidate emitted VM evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${{ runner.temp }}/swir-vendor-repository-vm-artifacts/vendor-repository-activation-vm-evidence.json"
          node - "$EVIDENCE" <<'NODE'
          const fs = require('node:fs');
          const e = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (e.schema !== 'swir.vendor-repository-activation-vm-e2e/0.1' || e.passed !== true) process.exit(2);
          if (!e.environment?.virtualization || e.environment.virtualization === 'none') process.exit(3);
          if (e.environment.physicalHardwareClaim !== false || e.environment.liveUsbClaim !== false) process.exit(4);
          if (e.policy?.repositoryId !== 'nvidia-cuda-debian13-x86_64' || !e.policy?.rootOwned || e.policy?.groupWorldWritable) process.exit(5);
          if (e.trust?.fingerprint !== '02182E60104FCDC26EAE1B8597A5D4CB8793F200' || e.trust?.evidenceFresh !== true) process.exit(6);
          if (!e.driverCenter?.vendorSourceVerified || e.driverCenter?.package !== 'nvidia-open') process.exit(7);
          if (e.activation?.state !== 'committed' || e.activation?.metadataRefreshExitCode !== 0 || !e.activation?.packageVisible) process.exit(8);
          if (e.activation?.explicitDeactivationState !== 'rolled-back' || !e.activation?.sourceRestoredAfterDeactivation) process.exit(9);
          if (e.interruptionRecovery?.interruptedState !== 'failed-needs-recovery' || e.interruptionRecovery?.recoveredState !== 'rolled-back' || !e.interruptionRecovery?.sourceRestored) process.exit(10);
          if (e.safety?.packageInstalled !== false || e.safety?.automaticRepositoryEnablement !== false || e.safety?.directPkexecPath !== false) process.exit(11);
          NODE

      - name: Upload vendor repository VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swir-vendor-repository-vm-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/swir-vendor-repository-vm-artifacts
          if-no-files-found: warn
          retention-days: 7
