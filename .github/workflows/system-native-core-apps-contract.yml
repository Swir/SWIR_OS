name: System Native Core Apps Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/**'
      - 'system/session/swir-shell.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-CORE-APPS-0.1.md'
      - '.github/workflows/system-native-core-apps-contract.yml'
  pull_request:
    paths:
      - 'system/apps/**'
      - 'system/session/swir-shell.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-CORE-APPS-0.1.md'
      - '.github/workflows/system-native-core-apps-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-core-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test unprivileged app runtime policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            system/apps/core_runtime.py \
            system/apps/core_runtime.selftest.py \
            system/apps/swir-files.py \
            system/apps/swir-network-center.py \
            system/apps/swir-notes.py \
            system/apps/swir-settings.py \
            system/apps/swir-system-monitor.py \
            system/apps/swir-terminal.py
          PYTHONPATH=system/apps python3 system/apps/core_runtime.selftest.py
          ! grep -RE 'shell *= *True|os\.system\(|subprocess\.(run|Popen)\([^\n]*shell *= *True' system/apps
          # Mentioning sudo/pkexec in documentation is allowed; invoking their
          # absolute production paths from first-party app code is not.
          ! grep -RE "/usr/bin/(sudo|pkexec|su)([[:space:]\"']|$)|/bin/su([[:space:]\"']|$)" system/apps/swir-*.py
          ! grep -RE 'subprocess\.(run|Popen).*\b(sudo|pkexec)\b' system/apps/swir-*.py
          grep -F 'fileOpenDelegationEnabled\": False' system/apps/swir-files.py >/dev/null
          grep -F 'mutationControlsExposed\": False' system/apps/swir-network-center.py >/dev/null
          grep -F 'ownerOnlyNotesFile' system/apps/swir-notes.py >/dev/null
          grep -F 'ownerOnlySettingsFile' system/apps/swir-settings.py >/dev/null
          grep -F 'processRowsBounded' system/apps/swir-system-monitor.py >/dev/null
          grep -F 'shellCommandInterpolation\": False' system/apps/swir-terminal.py >/dev/null
          grep -F 'Terminal\", ((\"/usr/local/bin/swir-terminal\",)' system/session/swir-shell.py >/dev/null
          grep -F 'Network\", ((\"/usr/local/bin/swir-network-center\",)' system/session/swir-shell.py >/dev/null

  wayland-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4, VTE and Wayland runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston python3-gi gir1.2-gtk-4.0 gir1.2-vte-3.91 libvte-2.91-gtk4-0 network-manager
      - name: Map native SWIR core apps on headless Wayland
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-runtime"
          CONFIG="${{ runner.temp }}/swir-config"
          DATA="${{ runner.temp }}/swir-data"
          mkdir -p "$RUNTIME" "$CONFIG" "$DATA"
          chmod 0700 "$RUNTIME" "$CONFIG" "$DATA"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export XDG_CONFIG_HOME="$CONFIG"
          export XDG_DATA_HOME="$DATA"
          export WAYLAND_DISPLAY=wayland-swir-apps
          export GDK_BACKEND=wayland
          export PYTHONPATH="$GITHUB_WORKSPACE/system/apps"

          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          run_app() {
            local label="$1"
            local evidence="$2"
            local script="$3"
            echo "Running ${label} runtime evidence"
            timeout --signal=TERM --kill-after=5s 25s \
              env SWIR_APP_E2E=1 SWIR_APP_EVIDENCE_PATH="$evidence" \
              python3 "$script"
          }

          run_app "SWIR Files" "$RUNTIME/files.json" system/apps/swir-files.py
          run_app "SWIR Network Center" "$RUNTIME/network.json" system/apps/swir-network-center.py
          run_app "SWIR Notes" "$RUNTIME/notes.json" system/apps/swir-notes.py
          run_app "SWIR Settings" "$RUNTIME/settings.json" system/apps/swir-settings.py
          run_app "SWIR System Monitor" "$RUNTIME/system-monitor.json" system/apps/swir-system-monitor.py
          run_app "SWIR Terminal" "$RUNTIME/terminal.json" system/apps/swir-terminal.py

          python3 - "$RUNTIME/files.json" "$RUNTIME/network.json" "$RUNTIME/notes.json" "$RUNTIME/settings.json" "$RUNTIME/system-monitor.json" "$RUNTIME/terminal.json" "$CONFIG/swir/settings.json" "$DATA/swir/notes.txt" <<'PY'
          import json, pathlib, stat, sys
          files = json.load(open(sys.argv[1], encoding='utf-8'))
          network = json.load(open(sys.argv[2], encoding='utf-8'))
          notes = json.load(open(sys.argv[3], encoding='utf-8'))
          settings = json.load(open(sys.argv[4], encoding='utf-8'))
          monitor = json.load(open(sys.argv[5], encoding='utf-8'))
          terminal = json.load(open(sys.argv[6], encoding='utf-8'))
          stored = json.load(open(sys.argv[7], encoding='utf-8'))
          notes_path = pathlib.Path(sys.argv[8])

          assert files['schema'] == 'swir.native-files-runtime-evidence/0.1'
          assert files['passed'] is True and files['applicationId'] == 'dev.swir.Files'
          assert files['nativeToolkit'] == 'gtk4' and files['displayProtocol'] == 'wayland'
          assert files['windowMapped'] is True and files['privilegedOperations'] is False
          assert files['currentDirectoryReadable'] is True and files['fileOpenDelegationEnabled'] is False

          assert network['schema'] == 'swir.native-network-center-runtime-evidence/0.1'
          assert network['passed'] is True and network['applicationId'] == 'dev.swir.NetworkCenter'
          assert network['nativeToolkit'] == 'gtk4' and network['displayProtocol'] == 'wayland'
          assert network['windowMapped'] is True and network['privilegedOperations'] is False
          assert network['mutationControlsExposed'] is False and network['nmcliAbsolutePath'] == '/usr/bin/nmcli'
          assert network['nmcliPresent'] is True and network['deviceRowsBounded'] == 100
          assert network['queryTimeoutSeconds'] == 4

          assert notes['schema'] == 'swir.native-notes-runtime-evidence/0.1'
          assert notes['passed'] is True and notes['applicationId'] == 'dev.swir.Notes'
          assert notes['nativeToolkit'] == 'gtk4' and notes['displayProtocol'] == 'wayland'
          assert notes['windowMapped'] is True and notes['privilegedOperations'] is False
          assert notes['atomicPersistence'] is True and notes['ownerOnlyNotesFile'] is True
          assert notes_path.read_text(encoding='utf-8') == 'SWIR Notes E2E\n'
          assert stat.S_IMODE(notes_path.stat().st_mode) == 0o600

          assert settings['schema'] == 'swir.native-settings-runtime-evidence/0.1'
          assert settings['passed'] is True and settings['applicationId'] == 'dev.swir.Settings'
          assert settings['nativeToolkit'] == 'gtk4' and settings['displayProtocol'] == 'wayland'
          assert settings['windowMapped'] is True and settings['privilegedOperations'] is False
          assert settings['ownerOnlySettingsFile'] is True and settings['settingsSchema'] == 'swir.user-settings/0.1'
          assert stored['schema'] == 'swir.user-settings/0.1'
          assert stat.S_IMODE(pathlib.Path(sys.argv[7]).stat().st_mode) == 0o600

          assert monitor['schema'] == 'swir.native-system-monitor-runtime-evidence/0.1'
          assert monitor['passed'] is True and monitor['applicationId'] == 'dev.swir.SystemMonitor'
          assert monitor['nativeToolkit'] == 'gtk4' and monitor['displayProtocol'] == 'wayland'
          assert monitor['windowMapped'] is True and monitor['privilegedOperations'] is False
          assert 0 < monitor['visibleProcessCount'] <= monitor['processRowsBounded'] == 200
          assert monitor['memTotalKiB'] > 0

          assert terminal['schema'] == 'swir.native-terminal-runtime-evidence/0.1'
          assert terminal['passed'] is True and terminal['applicationId'] == 'dev.swir.Terminal'
          assert terminal['nativeToolkit'] == 'gtk4-vte' and terminal['displayProtocol'] == 'wayland'
          assert terminal['windowMapped'] is True and terminal['ptyAttached'] is True
          assert terminal['privilegedOperations'] is False and terminal['shellCommandInterpolation'] is False
          assert terminal['scrollbackLines'] == 10000
          assert terminal['spawnApi'] in {'annotated-keyword', 'vte076-positional'}
          assert terminal['spawnError'] == ''
          assert terminal['vteRuntimeVersion']
          PY
