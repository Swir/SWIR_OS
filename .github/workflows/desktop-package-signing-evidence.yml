name: Desktop Package Signing Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-package-signing-evidence.yml'
      - 'desktop/windows/DesktopPackageSignature*.cs'
      - 'desktop/windows/SWIR.Desktop.PackageSignature*.csproj'
      - 'desktop/windows/build-store-packages.ps1'
      - 'desktop/windows/New-PackageSigningEvidence.ps1'
      - 'scripts/validate-package-signing-evidence.mjs'
      - 'scripts/verify-package-signing-evidence-run-provenance.mjs'
      - 'scripts/test-package-signing-evidence-run-provenance.mjs'
      - 'swir-packages.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-package-signing-evidence.yml'
      - 'desktop/windows/DesktopPackageSignature*.cs'
      - 'desktop/windows/SWIR.Desktop.PackageSignature*.csproj'
      - 'desktop/windows/build-store-packages.ps1'
      - 'desktop/windows/New-PackageSigningEvidence.ps1'
      - 'scripts/validate-package-signing-evidence.mjs'
      - 'scripts/verify-package-signing-evidence-run-provenance.mjs'
      - 'scripts/test-package-signing-evidence-run-provenance.mjs'
      - 'swir-packages.js'
  workflow_dispatch:
    inputs:
      production:
        description: 'Use protected production package signing and emit production evidence (main only)'
        required: true
        default: false
        type: boolean
      package_key_id:
        description: 'Ed25519 package signing key id; required for production evidence'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-package-signing-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-evidence:
    name: Ephemeral contract evidence
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/windows

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify signing evidence run provenance rejection cases
        working-directory: ${{ github.workspace }}
        run: node scripts/test-package-signing-evidence-run-provenance.mjs

      - name: Build package signing verifier
        run: dotnet build SWIR.Desktop.PackageSignatureTool.csproj --configuration Release

      - name: Prepare ephemeral evidence paths and key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Join-Path '${{ runner.temp }}' 'swir-package-evidence-contract'
          $privateKey = Join-Path '${{ runner.temp }}' 'swir-package-evidence-contract-private.b64'
          $trust = Join-Path $store 'package-trust-roots.json'
          $evidence = Join-Path $store 'package-signing-evidence.json'
          $signer = Join-Path (Get-Location) 'bin\Release\net8.0-windows\SWIR.Desktop.PackageSignatureTool.dll'
          "SWIR_EVIDENCE_STORE=$store" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_PRIVATE_KEY=$privateKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_TRUST=$trust" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_FILE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_SIGNER=$signer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_KEY_ID=ci-package-evidence-root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node -e "const fs=require('fs'),crypto=require('crypto'); const {privateKey}=crypto.generateKeyPairSync('ed25519'); const jwk=privateKey.export({format:'jwk'}); const raw=Buffer.from(jwk.d,'base64url'); if(raw.length!==32) throw new Error('Expected 32-byte Ed25519 raw private key'); fs.writeFileSync(process.argv[1], raw.toString('base64'));" $privateKey
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $privateKey -PathType Leaf)) { throw 'Could not generate ephemeral Ed25519 package signing key.' }

      - name: Build and independently verify ephemeral signed Store packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path (Get-Location) 'build-store-packages.ps1') `
            -OutputDir $env:SWIR_EVIDENCE_STORE `
            -SourceRoot '${{ github.workspace }}' `
            -PackageSigningKeyId $env:SWIR_EVIDENCE_KEY_ID `
            -PackageSigningPrivateKeyFile $env:SWIR_EVIDENCE_PRIVATE_KEY `
            -PackageTrustRootsOutput $env:SWIR_EVIDENCE_TRUST `
            -PackageSignerDll $env:SWIR_EVIDENCE_SIGNER
          if ($LASTEXITCODE -ne 0) { throw "Signed Store package build failed with exit code $LASTEXITCODE" }

      - name: Generate package signing contract evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path (Get-Location) 'New-PackageSigningEvidence.ps1') `
            -StoreDir $env:SWIR_EVIDENCE_STORE `
            -TrustRootsPath $env:SWIR_EVIDENCE_TRUST `
            -SignerDll $env:SWIR_EVIDENCE_SIGNER `
            -SourceCommit '${{ github.sha }}' `
            -ExpectedKeyId $env:SWIR_EVIDENCE_KEY_ID `
            -OutputPath $env:SWIR_EVIDENCE_FILE `
            -EvidenceKind contract `
            -GitHubRepository '${{ github.repository }}' `
            -GitHubRunId '${{ github.run_id }}' `
            -GitHubRunAttempt '${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw "Package signing evidence generation failed with exit code $LASTEXITCODE" }

      - name: Independently validate package signing contract evidence
        shell: pwsh
        run: |
          node '${{ github.workspace }}\scripts\validate-package-signing-evidence.mjs' $env:SWIR_EVIDENCE_FILE $env:SWIR_EVIDENCE_STORE $env:SWIR_EVIDENCE_TRUST contract
          if ($LASTEXITCODE -ne 0) { throw "Package signing evidence validation failed with exit code $LASTEXITCODE" }

      - name: Verify contract evidence run provenance
        shell: pwsh
        run: |
          node '${{ github.workspace }}\scripts\verify-package-signing-evidence-run-provenance.mjs' $env:SWIR_EVIDENCE_FILE contract '${{ github.repository }}' '${{ github.sha }}' '${{ github.run_id }}' '${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw "Package signing contract evidence run provenance failed with exit code $LASTEXITCODE" }

      - name: Destroy ephemeral signing key
        if: always()
        shell: pwsh
        run: |
          $path = $env:SWIR_EVIDENCE_PRIVATE_KEY
          if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path $path -PathType Leaf)) {
            $length = [int](Get-Item -LiteralPath $path).Length
            if ($length -gt 0) { [System.IO.File]::WriteAllBytes($path, [byte[]]::new($length)) }
            Remove-Item -LiteralPath $path -Force
          }
          if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path $path)) { throw 'Ephemeral package signing key file survived cleanup.' }

      - name: Upload non-secret contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-signing-contract-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/swir-package-evidence-contract/package-signing-evidence.json
            ${{ runner.temp }}/swir-package-evidence-contract/package-trust-roots.json
            ${{ runner.temp }}/swir-package-evidence-contract/catalog-artifacts.json
          if-no-files-found: error
          retention-days: 7

  production-evidence:
    name: Protected production evidence
    if: github.event_name == 'workflow_dispatch' && inputs.production == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: desktop-production-signing
    defaults:
      run:
        working-directory: desktop/windows
    env:
      SWIR_PACKAGE_KEY_ID: ${{ inputs.package_key_id }}
      SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate protected signing inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SWIR_PACKAGE_KEY_ID -notmatch '^[A-Za-z0-9._-]{1,128}$') { throw 'package_key_id is required and invalid.' }
          if ([string]::IsNullOrWhiteSpace($env:SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64)) { throw 'Protected SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64 secret is not configured.' }
          try { $raw = [Convert]::FromBase64String($env:SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64.Trim()) }
          catch { throw 'Protected package signing private key is not canonical base64.' }
          try {
            if ($raw.Length -ne 32) { throw 'Protected Ed25519 package signing private key must be exactly 32 bytes.' }
            if ([Convert]::ToBase64String($raw) -cne $env:SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64.Trim()) { throw 'Protected package signing private key must use canonical base64.' }
          }
          finally { if ($null -ne $raw) { [System.Security.Cryptography.CryptographicOperations]::ZeroMemory($raw) } }

      - name: Build package signing verifier
        run: dotnet build SWIR.Desktop.PackageSignatureTool.csproj --configuration Release

      - name: Prepare protected evidence paths
        shell: pwsh
        run: |
          $store = Join-Path '${{ runner.temp }}' 'swir-package-evidence-production'
          $privateKey = Join-Path '${{ runner.temp }}' 'swir-package-evidence-production-private.b64'
          $trust = Join-Path $store 'package-trust-roots.json'
          $evidence = Join-Path $store 'package-signing-evidence.json'
          $signer = Join-Path (Get-Location) 'bin\Release\net8.0-windows\SWIR.Desktop.PackageSignatureTool.dll'
          "SWIR_EVIDENCE_STORE=$store" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_PRIVATE_KEY=$privateKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_TRUST=$trust" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_FILE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIR_EVIDENCE_SIGNER=$signer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output '::add-mask::${{ secrets.SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64 }}'
          [System.IO.File]::WriteAllText($privateKey, $env:SWIR_PACKAGE_SIGNING_PRIVATE_KEY_BASE64, [System.Text.UTF8Encoding]::new($false))

      - name: Build and independently verify protected signed Store packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path (Get-Location) 'build-store-packages.ps1') `
            -OutputDir $env:SWIR_EVIDENCE_STORE `
            -SourceRoot '${{ github.workspace }}' `
            -PackageSigningKeyId $env:SWIR_PACKAGE_KEY_ID `
            -PackageSigningPrivateKeyFile $env:SWIR_EVIDENCE_PRIVATE_KEY `
            -PackageTrustRootsOutput $env:SWIR_EVIDENCE_TRUST `
            -PackageSignerDll $env:SWIR_EVIDENCE_SIGNER
          if ($LASTEXITCODE -ne 0) { throw "Production signed Store package build failed with exit code $LASTEXITCODE" }

      - name: Generate protected production signing evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path (Get-Location) 'New-PackageSigningEvidence.ps1') `
            -StoreDir $env:SWIR_EVIDENCE_STORE `
            -TrustRootsPath $env:SWIR_EVIDENCE_TRUST `
            -SignerDll $env:SWIR_EVIDENCE_SIGNER `
            -SourceCommit '${{ github.sha }}' `
            -ExpectedKeyId $env:SWIR_PACKAGE_KEY_ID `
            -OutputPath $env:SWIR_EVIDENCE_FILE `
            -EvidenceKind production `
            -GitHubRepository '${{ github.repository }}' `
            -GitHubRunId '${{ github.run_id }}' `
            -GitHubRunAttempt '${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw "Production signing evidence generation failed with exit code $LASTEXITCODE" }

      - name: Independently validate production signing evidence
        shell: pwsh
        run: |
          node '${{ github.workspace }}\scripts\validate-package-signing-evidence.mjs' $env:SWIR_EVIDENCE_FILE $env:SWIR_EVIDENCE_STORE $env:SWIR_EVIDENCE_TRUST production
          if ($LASTEXITCODE -ne 0) { throw "Production signing evidence validation failed with exit code $LASTEXITCODE" }

      - name: Verify protected production evidence run provenance
        shell: pwsh
        run: |
          node '${{ github.workspace }}\scripts\verify-package-signing-evidence-run-provenance.mjs' $env:SWIR_EVIDENCE_FILE production '${{ github.repository }}' '${{ github.sha }}' '${{ github.run_id }}' '${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw "Production package signing evidence run provenance failed with exit code $LASTEXITCODE" }

      - name: Destroy protected signing key material
        if: always()
        shell: pwsh
        run: |
          $path = $env:SWIR_EVIDENCE_PRIVATE_KEY
          if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path $path -PathType Leaf)) {
            $length = [int](Get-Item -LiteralPath $path).Length
            if ($length -gt 0) { [System.IO.File]::WriteAllBytes($path, [byte[]]::new($length)) }
            Remove-Item -LiteralPath $path -Force
          }
          if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path $path)) { throw 'Production package signing key file survived cleanup.' }

      - name: Upload public production signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-signing-production-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/swir-package-evidence-production/package-signing-evidence.json
            ${{ runner.temp }}/swir-package-evidence-production/package-trust-roots.json
            ${{ runner.temp }}/swir-package-evidence-production/catalog-artifacts.json
          if-no-files-found: error
          retention-days: 90
