name: System Native Hardware Center

on:
  push:
    branches: [main]
    paths:
      - 'system/apps/core_runtime.py'
      - 'system/apps/hardware_center_runtime.py'
      - 'system/apps/hardware_center_runtime.selftest.py'
      - 'system/apps/swir-hardware-center.py'
      - 'system/hardware/hardware-service.mjs'
      - 'system/hardware/driver-resolver.mjs'
      - 'system/hardware/driver-center-service.mjs'
      - 'system/hardware/driver-center-report.mjs'
      - 'system/hardware/fwupd-lvfs-service.mjs'
      - 'system/hardware/hardware-catalog.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/session/swir-shell.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-CORE-APPS-0.1.md'
      - '.github/workflows/system-native-hardware-center.yml'
  pull_request:
    paths:
      - 'system/apps/core_runtime.py'
      - 'system/apps/hardware_center_runtime.py'
      - 'system/apps/hardware_center_runtime.selftest.py'
      - 'system/apps/swir-hardware-center.py'
      - 'system/hardware/hardware-service.mjs'
      - 'system/hardware/driver-resolver.mjs'
      - 'system/hardware/driver-center-service.mjs'
      - 'system/hardware/driver-center-report.mjs'
      - 'system/hardware/fwupd-lvfs-service.mjs'
      - 'system/hardware/hardware-catalog.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/session/swir-shell.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/SWIR-NATIVE-CORE-APPS-0.1.md'
      - '.github/workflows/system-native-hardware-center.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-native-hardware-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate hardware UI adapter and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            system/apps/core_runtime.py \
            system/apps/hardware_center_runtime.py \
            system/apps/hardware_center_runtime.selftest.py \
            system/apps/swir-hardware-center.py \
            system/session/swir-shell.py
          PYTHONPATH=system/apps python3 system/apps/hardware_center_runtime.selftest.py
          node --check system/hardware/hardware-service.mjs
          node --check system/hardware/driver-resolver.mjs
          node --check system/hardware/driver-center-service.mjs
          node --check system/hardware/driver-center-report.mjs
          node --check system/hardware/fwupd-lvfs-service.mjs
          node system/hardware/driver-center-runtime.selftest.mjs
          node system/hardware/driver-center-service.selftest.mjs
          bash -n system/session/provision-graphical-session.sh
          grep -F 'Hardware", (("/usr/local/bin/swir-hardware-center",)' system/session/swir-shell.py >/dev/null
          grep -F 'system/apps/swir-hardware-center.py' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'system/hardware/driver-center-report.mjs' system/session/provision-graphical-session.sh >/dev/null
          grep -F '/usr/local/bin/swir-hardware-center' system/session/provision-graphical-session.sh >/dev/null
          grep -F '/usr/local/lib/swir/hardware/driver-center-report.mjs' system/session/provision-graphical-session.sh >/dev/null
          grep -F 'mutationControlsExposed": False' system/apps/swir-hardware-center.py >/dev/null
          grep -F 'firmwareMutationControlsExposed": False' system/apps/swir-hardware-center.py >/dev/null
          grep -F 'firmwareInventoryReadOnly": True' system/apps/swir-hardware-center.py >/dev/null
          grep -F 'arbitraryDriverDownloadsAllowed": False' system/apps/swir-hardware-center.py >/dev/null
          grep -F 'windowsKernelDriversAsLinuxPath": False' system/apps/swir-hardware-center.py >/dev/null
          grep -F 'UserSettingsStore' system/apps/swir-hardware-center.py >/dev/null
          grep -F 'localizedTooltips' system/apps/swir-hardware-center.py >/dev/null
          ! grep -RE '/usr/bin/(sudo|pkexec|su)|/bin/su|os\.system\(|shell *= *True' \
            system/apps/swir-hardware-center.py \
            system/apps/hardware_center_runtime.py

  wayland-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled GTK4, Wayland and Node runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston python3-gi gir1.2-gtk-4.0 nodejs
      - name: Map localized Hardware Center and load trusted report
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="${{ runner.temp }}/swir-hardware-runtime"
          CONFIG="${{ runner.temp }}/swir-hardware-config"
          mkdir -p "$RUNTIME" "$CONFIG/swir"
          chmod 0700 "$RUNTIME" "$CONFIG" "$CONFIG/swir"
          cat > "$CONFIG/swir/settings.json" <<'JSON'
          {
            "schema": "swir.user-settings/0.1",
            "appearance": "dark",
            "language": "pl-PL",
            "clock24h": true,
            "themeId": "builtin.swir-dark"
          }
          JSON
          chmod 0600 "$CONFIG/swir/settings.json"
          export XDG_RUNTIME_DIR="$RUNTIME"
          export XDG_CONFIG_HOME="$CONFIG"
          export WAYLAND_DISPLAY=wayland-swir-hardware
          export GDK_BACKEND=wayland
          export PYTHONPATH="$GITHUB_WORKSPACE/system/apps"

          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNTIME/weston.log" &
          WESTON_PID=$!
          cleanup() { kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$WESTON_PID"
            sleep 0.25
          done
          [[ -S "$RUNTIME/$WAYLAND_DISPLAY" ]]

          timeout --signal=TERM --kill-after=5s 30s \
            env SWIR_APP_E2E=1 \
              SWIR_APP_EVIDENCE_PATH="$RUNTIME/hardware.json" \
              SWIR_HARDWARE_CENTER_REPORT_SCRIPT="$GITHUB_WORKSPACE/system/hardware/driver-center-report.mjs" \
              python3 system/apps/swir-hardware-center.py

          python3 - "$RUNTIME/hardware.json" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1], encoding='utf-8'))
          assert evidence['schema'] == 'swir.native-hardware-center-runtime-evidence/0.2'
          assert evidence['passed'] is True
          assert evidence['applicationId'] == 'dev.swir.HardwareCenter'
          assert evidence['nativeToolkit'] == 'gtk4' and evidence['displayProtocol'] == 'wayland'
          assert evidence['windowMapped'] is True and evidence['reportLoaded'] is True
          assert evidence['privilegedOperationsInUi'] is False
          assert evidence['mutationControlsExposed'] is False
          assert evidence['firmwareMutationControlsExposed'] is False
          assert evidence['driverReportReadOnly'] is True
          assert evidence['firmwareInventoryReadOnly'] is True
          assert evidence['arbitraryDriverDownloadsAllowed'] is False
          assert evidence['windowsKernelDriversAsLinuxPath'] is False
          assert evidence['queryTimeoutSeconds'] == 6
          assert evidence['deviceRowsBounded'] == 256 and evidence['operationRowsBounded'] == 256
          assert evidence['firmwareRowsBounded'] == 128
          assert 0 <= evidence['visibleDeviceCount'] <= 256
          assert 0 <= evidence['visibleOperationCount'] <= 256
          assert 0 <= evidence['visibleFirmwareUpdateCount'] <= 128
          assert evidence['requestedLanguage'] == 'pl-PL' and evidence['catalogLanguage'] == 'pl-PL'
          assert evidence['translationFallback'] is False and evidence['textDirection'] == 'ltr'
          assert evidence['localizedWindowTitle'] == 'Centrum sprzętu i sterowników SWIR'
          assert evidence['localizedRefreshLabel'] == 'Odśwież diagnostykę'
          assert evidence['localizedSurfaceVerified'] is True
          assert evidence['refreshButtonFocusable'] is True and evidence['localizedTooltips'] is True
          assert evidence['error'] == ''
          PY

          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('system/apps/swir-hardware-center.py')
          resolve = namespace['hardware_locale']
          fallback = resolve('fr-FR')
          assert fallback.requested_language == 'fr-FR'
          assert fallback.catalog_language == 'en' and fallback.fallback is True
          assert fallback.text('window_title') == 'SWIR Hardware & Driver Center'
          norwegian = resolve('nb-NO')
          assert norwegian.catalog_language == 'nb-NO' and norwegian.fallback is False
          assert norwegian.text('refresh') == 'Oppdater diagnostikk'
          PY
