name: Desktop Authenticode Contract

on:
  push:
    branches: [main]
    paths:
      - 'desktop/windows/sign-desktop-artifact.ps1'
      - 'desktop/windows/publish-desktop-host.ps1'
      - 'desktop/windows/build-desktop-installer.ps1'
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - 'desktop/windows/SWIR.Desktop.Installer.csproj'
      - '.github/workflows/desktop-authenticode-contract.yml'
  pull_request:
    paths:
      - 'desktop/windows/sign-desktop-artifact.ps1'
      - 'desktop/windows/publish-desktop-host.ps1'
      - 'desktop/windows/build-desktop-installer.ps1'
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - 'desktop/windows/SWIR.Desktop.Installer.csproj'
      - '.github/workflows/desktop-authenticode-contract.yml'

permissions:
  contents: read

jobs:
  authenticode-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Provision isolated CI code-signing identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # Build an ephemeral two-certificate hierarchy entirely in memory.
          # The test leaf is issued by a short-lived CA that exists only in the
          # hosted runner's CurrentUser Root store and is removed in the always
          # cleanup step. This lets Get-AuthenticodeSignature exercise the same
          # Windows trust-chain policy as a real release without storing any
          # production signing material in the repository.
          $notBefore = [DateTimeOffset]::UtcNow.AddMinutes(-5)
          $rootNotAfter = [DateTimeOffset]::UtcNow.AddDays(2)
          $leafNotAfter = [DateTimeOffset]::UtcNow.AddDays(1)
          $rootRsa = [System.Security.Cryptography.RSA]::Create(2048)
          $leafRsa = [System.Security.Cryptography.RSA]::Create(2048)
          try {
            $rootRequest = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              'CN=SWIR OS CI Authenticode Root',
              $rootRsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $rootRequest.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($true, $false, 0, $true)
            )
            $rootRequest.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::KeyCertSign -bor
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::CrlSign,
                $true
              )
            )
            $rootRequest.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509SubjectKeyIdentifierExtension]::new($rootRequest.PublicKey, $false)
            )
            $rootCert = $rootRequest.CreateSelfSigned($notBefore, $rootNotAfter)
            try {
              $leafRequest = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
                'CN=SWIR OS CI Authenticode Contract',
                $leafRsa,
                [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
              )
              $eku = [System.Security.Cryptography.OidCollection]::new()
              [void]$eku.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3', 'Code Signing'))
              $leafRequest.CertificateExtensions.Add(
                [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($eku, $true)
              )
              $leafRequest.CertificateExtensions.Add(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                  [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
                  $true
                )
              )
              $leafRequest.CertificateExtensions.Add(
                [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $true)
              )
              $leafRequest.CertificateExtensions.Add(
                [System.Security.Cryptography.X509Certificates.X509SubjectKeyIdentifierExtension]::new($leafRequest.PublicKey, $false)
              )

              $serial = [byte[]]::new(16)
              [System.Security.Cryptography.RandomNumberGenerator]::Fill($serial)
              $serial[0] = $serial[0] -bor 1
              $leafPublic = $leafRequest.Create($rootCert, $notBefore, $leafNotAfter, $serial)
              try {
                $leafCert = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::CopyWithPrivateKey($leafPublic, $leafRsa)
                try {
                  if (-not $leafCert.HasPrivateKey) { throw 'CI code-signing certificate has no private key.' }
                  $passwordText = 'SWIR-CI-Authenticode-Contract-Only!2026'
                  $pfx = Join-Path $env:RUNNER_TEMP 'swir-ci-authenticode.pfx'
                  [IO.File]::WriteAllBytes($pfx, $leafCert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $passwordText))

                  $rootPublic = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                    $rootCert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
                  )
                  try {
                    $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                      [System.Security.Cryptography.X509Certificates.StoreName]::Root,
                      [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
                    )
                    try {
                      $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                      $rootStore.Add($rootPublic)
                      $matches = $rootStore.Certificates.Find(
                        [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                        $rootPublic.Thumbprint,
                        $false
                      )
                      if ($matches.Count -ne 1) { throw 'Ephemeral Authenticode CI root was not installed exactly once.' }
                    } finally {
                      $rootStore.Close()
                      $rootStore.Dispose()
                    }
                  } finally {
                    $rootPublic.Dispose()
                  }

                  "SWIR_AUTHENTICODE_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "SWIR_AUTHENTICODE_PFX_PASSWORD=$passwordText" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "SWIR_AUTHENTICODE_CERT_THUMBPRINT=$($leafCert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "SWIR_AUTHENTICODE_ROOT_THUMBPRINT=$($rootCert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "SWIR_AUTHENTICODE_REQUIRED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                } finally {
                  $leafCert.Dispose()
                }
              } finally {
                $leafPublic.Dispose()
              }
            } finally {
              $rootCert.Dispose()
            }
          } finally {
            $leafRsa.Dispose()
            $rootRsa.Dispose()
          }

      - name: Verify signing helper fail-closed and tamper detection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Use a fresh unsigned PowerShell fixture. A Windows inbox executable
          # can already carry a Microsoft Authenticode signature; re-signing it
          # may leave multiple signatures and make Get-AuthenticodeSignature
          # report the original signer instead of the pinned CI identity.
          $target = Join-Path $env:RUNNER_TEMP 'swir-authenticode-helper-fixture.ps1'
          Set-Content -LiteralPath $target -Value "Write-Output 'SWIR Authenticode fixture'" -Encoding utf8NoBOM
          $helper = Join-Path (Get-Location) 'sign-desktop-artifact.ps1'
          $result = & $helper -FilePath $target | ConvertFrom-Json
          if ($result.schema -ne 'swir.desktop-authenticode/0.1' -or $result.status -ne 'valid' -or $result.signerThumbprint -ne $env:SWIR_AUTHENTICODE_CERT_THUMBPRINT) {
            throw 'Signing helper did not bind the artifact to the pinned CI certificate.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $target
          if ($signature.Status -ne 'Valid') { throw "Signed helper fixture is not valid: $($signature.Status)" }
          Add-Content -LiteralPath $target -Value '# tamper-after-signing'
          $tampered = Get-AuthenticodeSignature -FilePath $target
          if ($tampered.Status -eq 'Valid') { throw 'Authenticode remained valid after artifact tampering.' }

          $wrong = Join-Path $env:RUNNER_TEMP 'swir-authenticode-wrong-pin.ps1'
          Set-Content -LiteralPath $wrong -Value "Write-Output 'SWIR wrong-pin fixture'" -Encoding utf8NoBOM
          $failed = $false
          try { & $helper -FilePath $wrong -ExpectedThumbprint ('0' * 40) | Out-Null } catch { $failed = $true }
          if (-not $failed) { throw 'Signing helper accepted the wrong pinned certificate thumbprint.' }

      - name: Publish Authenticode-signed bundled Desktop Host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'swir-authenticode-host'
          & (Join-Path (Get-Location) 'publish-desktop-host.ps1') `
            -PublishDir $publish `
            -ReleaseVersion '0.5.7' `
            -Channel preview `
            -SourceCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Signed Desktop Host publish failed with exit code $LASTEXITCODE." }
          $host = Join-Path $publish 'SWIR.Desktop.Host.exe'
          $manifest = Get-Content (Join-Path $publish 'desktop-host-build.json') -Raw | ConvertFrom-Json
          if ($manifest.authenticode.contract -ne 'swir.desktop-authenticode/0.1' -or $manifest.authenticode.required -ne $true -or $manifest.authenticode.signed -ne $true -or $manifest.authenticode.status -ne 'valid') {
            throw 'Desktop Host build manifest does not prove required Authenticode signing.'
          }
          if ($manifest.authenticode.signerThumbprint -ne $env:SWIR_AUTHENTICODE_CERT_THUMBPRINT) { throw 'Desktop Host manifest signer pin mismatch.' }
          $signature = Get-AuthenticodeSignature -FilePath $host
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:SWIR_AUTHENTICODE_CERT_THUMBPRINT) { throw 'Desktop Host Authenticode verification failed.' }
          $hash = (Get-FileHash -LiteralPath $host -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.integrity.entryPoint.sha256 -ne $hash) { throw 'Desktop Host integrity manifest was not calculated from the signed Host bytes.' }

      - name: Build Authenticode-signed one-file Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $publish = Join-Path $env:RUNNER_TEMP 'swir-authenticode-host'
          $payload = Join-Path $env:RUNNER_TEMP 'SWIR-Desktop-0.5.7-preview.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($publish, $payload, [IO.Compression.CompressionLevel]::Optimal, $false)
          $out = Join-Path $env:RUNNER_TEMP 'swir-authenticode-setup'
          & (Join-Path (Get-Location) 'build-desktop-installer.ps1') `
            -PackageZip $payload `
            -OutputDir $out `
            -Version '0.5.7' `
            -Channel preview
          if ($LASTEXITCODE -ne 0) { throw "Signed Desktop Setup build failed with exit code $LASTEXITCODE." }
          $setup = Join-Path $out 'SWIR-Desktop-Setup-0.5.7-preview.exe'
          $manifest = Get-Content (Join-Path $out 'desktop-installer-build.json') -Raw | ConvertFrom-Json
          if ($manifest.authenticode.contract -ne 'swir.desktop-authenticode/0.1' -or $manifest.authenticode.required -ne $true -or $manifest.authenticode.signed -ne $true -or $manifest.authenticode.status -ne 'valid') {
            throw 'Desktop Setup build manifest does not prove required Authenticode signing.'
          }
          if ($manifest.authenticode.signerThumbprint -ne $env:SWIR_AUTHENTICODE_CERT_THUMBPRINT) { throw 'Desktop Setup manifest signer pin mismatch.' }
          $signature = Get-AuthenticodeSignature -FilePath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:SWIR_AUTHENTICODE_CERT_THUMBPRINT) { throw 'Desktop Setup Authenticode verification failed.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.installerSha256 -ne $hash) { throw 'Desktop Setup manifest was not calculated from the signed Setup bytes.' }

      - name: Cleanup CI certificate
        if: always()
        shell: pwsh
        run: |
          $rootThumb = ($env:SWIR_AUTHENTICODE_ROOT_THUMBPRINT -replace '[^A-Fa-f0-9]', '').ToUpperInvariant()
          if ($rootThumb) {
            $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              [System.Security.Cryptography.X509Certificates.StoreName]::Root,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            try {
              $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $matches = $rootStore.Certificates.Find(
                [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $rootThumb,
                $false
              )
              foreach ($match in $matches) { $rootStore.Remove($match) }
            } finally {
              $rootStore.Close()
              $rootStore.Dispose()
            }
          }
