name: System Live USB Install UEFI E2E

on:
  push:
    branches: [main]
    paths:
      - 'system/image/build-live-usb-img.sh'
      - 'system/installer/swir-install-engine.sh'
      - 'system/e2e/debian13-live-usb-install-vm-e2e.sh'
      - 'system/image/validate-live-usb-install-evidence.mjs'
      - 'system/contracts/system-live-usb-install-e2e.schema.json'
      - 'system/session/**'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/image/system-base-debian-trixie.json'
      - 'system/SWIR-LIVE-USB-INSTALL-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - 'README.md'
      - '.github/workflows/system-live-usb-install-vm-e2e.yml'
  pull_request:
    paths:
      - 'system/image/build-live-usb-img.sh'
      - 'system/installer/swir-install-engine.sh'
      - 'system/e2e/debian13-live-usb-install-vm-e2e.sh'
      - 'system/image/validate-live-usb-install-evidence.mjs'
      - 'system/contracts/system-live-usb-install-e2e.schema.json'
      - 'system/session/**'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/image/system-base-debian-trixie.json'
      - 'system/SWIR-LIVE-USB-INSTALL-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - 'README.md'
      - '.github/workflows/system-live-usb-install-vm-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-live-usb-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate installer and media source syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n system/image/build-live-usb-img.sh
          bash -n system/installer/swir-install-engine.sh
          bash -n system/e2e/debian13-live-usb-install-vm-e2e.sh
          node --check system/image/validate-live-usb-install-evidence.mjs
          python3 -m json.tool system/contracts/system-live-usb-install-e2e.schema.json >/dev/null
      - name: Enforce install safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'target must use a stable /dev/disk/by-id/* path' system/installer/swir-install-engine.sh >/dev/null
          grep -F 'refusing to install onto the currently booted source media' system/installer/swir-install-engine.sh >/dev/null
          grep -F 'confirmation token does not match the current target identity' system/installer/swir-install-engine.sh >/dev/null
          grep -F 'destructiveWritePerformed": False' system/installer/swir-install-engine.sh >/dev/null
          grep -F 'usb-storage,drive=liveusb,bootindex=1,serial=SWIR_LIVE_E2E' system/e2e/debian13-live-usb-install-vm-e2e.sh >/dev/null
          grep -F 'sourceUsbDetachedBeforeInstalledBoot' system/e2e/debian13-live-usb-install-vm-e2e.sh >/dev/null
          grep -F '"graphicalInstallerClaim": False' system/e2e/debian13-live-usb-install-vm-e2e.sh >/dev/null
          ! grep -E 'curl |wget |--no-check-gpg|AllowUnauthenticated|trusted=yes' system/image/build-live-usb-img.sh system/installer/swir-install-engine.sh system/e2e/debian13-live-usb-install-vm-e2e.sh
      - name: Validate locked roadmap math
        run: node scripts/validate-roadmap-progress.mjs

  live-install-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install controlled image and VM dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring qemu-system-x86 qemu-utils ovmf \
            e2fsprogs dosfstools rsync parted util-linux udev
      - name: Boot Live USB, install to blank disk and boot installed system
        env:
          SWIR_LIVE_INSTALL_WORK_ROOT: ${{ runner.temp }}/swir-live-install-e2e
          SWIR_LIVE_INSTALL_ARTIFACT_DIR: ${{ runner.temp }}/swir-live-install-e2e-artifacts
        run: sudo --preserve-env=SWIR_LIVE_INSTALL_WORK_ROOT,SWIR_LIVE_INSTALL_ARTIFACT_DIR bash system/e2e/debian13-live-usb-install-vm-e2e.sh
      - name: Export readable diagnostics
        if: always()
        run: sudo chown -R "$USER:$USER" "${{ runner.temp }}/swir-live-install-e2e-artifacts" 2>/dev/null || true
      - name: Validate Live USB/install evidence
        if: success()
        run: node system/image/validate-live-usb-install-evidence.mjs "${{ runner.temp }}/swir-live-install-e2e-artifacts/live-usb-install-evidence.json"
      - name: Upload compact Live/install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swir-live-usb-install-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/swir-live-install-e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
