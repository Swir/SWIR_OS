<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">SWIR SDK Starter icon</title>
  <desc id="desc">Dark rounded square with electric cyan code brackets and a central SWIR spark.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="1" stop-color="#62E5FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#02050A" stroke="#173a54" stroke-width="4"/>
  <path d="M46 37 23 64l23 27" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m82 37 23 27-23 27" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m70 35-14 58" fill="none" stroke="#F4FAFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="5" fill="#62E5FF"/>
</svg>
