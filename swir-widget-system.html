<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWIR System Widget</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 82% 8%,#0088ff28,transparent 38%),#02050a;color:#f4faff;font-family:Inter,system-ui,"Segoe UI",sans-serif}.card{width:min(620px,calc(100vw - 28px));border:1px solid #62e5ff38;border-radius:22px;padding:24px;background:linear-gradient(145deg,#07111cf2,#02050af2);box-shadow:0 20px 70px #0008,0 0 34px #0088ff18}.k{color:#62e5ff;font:800 11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.14em}.title{margin-top:12px;font-size:34px;font-weight:900}.sub{margin-top:6px;color:#8da8b8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:20px}.stat{border:1px solid #62e5ff1f;border-radius:12px;padding:13px;background:#ffffff05}.stat strong{display:block;font:900 19px/1.1 ui-monospace,Consolas,monospace}.stat span{display:block;margin-top:6px;color:#7895a6;font:800 9px ui-monospace,Consolas,monospace;text-transform:uppercase}.foot{margin-top:20px;padding-top:13px;border-top:1px solid #62e5ff1f;color:#6f8c9d;font:10px/1.5 ui-monospace,Consolas,monospace}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
<main class="card">
  <div class="k">SWIR INSTALLABLE WIDGET</div>
  <div id="title" class="title">WEB</div>
  <div class="sub">Read-only SWIR Platform runtime snapshot</div>
  <section class="grid" aria-label="Runtime status">
    <div class="stat"><strong id="version">1.7</strong><span>OS version</span></div>
    <div class="stat"><strong id="api">2</strong><span>Platform API</span></div>
    <div class="stat"><strong id="packages">0</strong><span>Packages</span></div>
  </section>
  <div class="foot">Read-only • local runtime state • no network • no privileged operations</div>
</main>
<script>
(async () => {
  'use strict';
  let platform=null;try{platform=parent.SwirPlatform}catch(_){platform=null}
  let info={};try{info=platform?.system?.info?.()||{}}catch(_){}
  let packages=[];try{packages=await platform?.packages?.list?.()||[]}catch(_){}
  document.getElementById('title').textContent=String(info.edition||'WEB').toUpperCase();
  document.getElementById('version').textContent=String(info.version||'1.7');
  document.getElementById('api').textContent=String(info.platformApi||2);
  document.getElementById('packages').textContent=String(packages.filter(item=>item?.installed!==false).length);
})();
</script>
</body>
</html>
